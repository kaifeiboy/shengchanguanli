async function invOcrBuildOverlay(imgUrl){
  // 重置点击四角状态（新图加载后旧角点失效）
  itOcr.capturingCorners = false; itOcr.corners = []; itOcr._lastCornerT = 0;
  invOcrEndCornerCaptureLayer();
  // 销毁旧弹层
  if (itOcr.overlay) itOcr.overlay.remove();
  const ov = document.createElement('div');
  ov.className = 'it-ocr-overlay';
  ov.innerHTML = `
    <div class="it-ocr-top">
      <div class="ttl">📷 拍照识别</div>
      <div class="it-ocr-wb" id="itOcrWb">
        <button data-wb="gray" class="active">灰世界</button>
        <button data-wb="white">白点</button>
        <button data-wb="none">关闭</button>
      </div>
      <button class="btn" id="itOcrClose">✕ 关闭</button>
    </div>
    <div class="it-ocr-canvas-wrap" id="itOcrWrap">
      <canvas id="itOcrCanvas"></canvas>
      <div id="itOcrHint" class="it-ocr-hint" style="top:8px;left:8px;">处理中…</div>
    </div>
    <div class="it-ocr-bot">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn" id="itOcrClickCorner">🖱 点击四角</button>
        <button class="btn pri" id="itOcrRecognize">🔍 识别当前框</button>
        <div style="flex:1;font-size:11.5px;color:#94a3b8;" id="itOcrStatus">等待框选</div>
      </div>
      <div class="it-ocr-results" id="itOcrResults"></div>
      <div class="actbar" id="itOcrActs" style="display:none;">
        <button class="btn" id="itOcrCancel">取消</button>
        <button class="btn ok" id="itOcrConfirm">✅ 使用这 <span id="itOcrCount">0</span> 条</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  itOcr.overlay = ov;
  itOcr.canvas = ov.querySelector('#itOcrCanvas');
  itOcr.ctx = itOcr.canvas.getContext('2d');

  // 加载处理后的图
  const im = new Image();
  im.crossOrigin = 'anonymous';
  await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = imgUrl; });
  itOcr.img = im;
  itOcr.canvas.width = im.naturalWidth; itOcr.canvas.height = im.naturalHeight;
  // 显示缩放（按容器宽度等比缩放）
  const wrap = ov.querySelector('#itOcrWrap');
  const maxW = wrap.clientWidth - 24;
  if (im.naturalWidth > maxW){
    const sc = maxW / im.naturalWidth;
    itOcr.canvas.style.width = (im.naturalWidth*sc)+'px';
    itOcr.canvas.style.height = (im.naturalHeight*sc)+'px';
  }
  itOcr.ctx.drawImage(im, 0, 0);

  // 事件
  ov.querySelector('#itOcrClose').onclick = invOcrClose;
  ov.querySelector('#itOcrClickCorner').onclick = invOcrStartCornerCapture;
  ov.querySelector('#itOcrRecognize').onclick = invOcrRecognize;
  ov.querySelector('#itOcrCancel').onclick = invOcrClose;
  ov.querySelector('#itOcrConfirm').onclick = invOcrConfirm;
  ov.querySelectorAll('#itOcrWb button').forEach(b => b.onclick = () => invOcrSwitchWb(b.dataset.wb));

  // 画框（绝对定位的 div）
  itOcr.selEl = document.createElement('div');
  itOcr.selEl.className = 'it-ocr-sel';
  itOcr.selEl.style.display = 'none';
  ov.appendChild(itOcr.selEl);

  // 鼠标 / 触摸画框（用视口坐标定位选区 div：遮罩是 position:fixed，选区相对视口，避免向上/向左偏移）
  let startX=0, startY=0;
  const getClient = (e) => {
    const t = (e.touches ? e.touches[0] : e);
    return {x: t.clientX, y: t.clientY};
  };
  const down = (e) => {
    e.preventDefault();
    itOcr.drawing = true;
    const p = getClient(e);
    startX = p.x; startY = p.y;
    itOcr.selEl.style.left = p.x + 'px';
    itOcr.selEl.style.top  = p.y + 'px';
    itOcr.selEl.style.width = '0px'; itOcr.selEl.style.height = '0px';
    itOcr.selEl.style.display = 'block';
  };
  const move = (e) => {
    if (!itOcr.drawing) return;
    e.preventDefault();
    const p = getClient(e);
    const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
    const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
    itOcr.selEl.style.left = x + 'px'; itOcr.selEl.style.top = y + 'px';
    itOcr.selEl.style.width = w + 'px'; itOcr.selEl.style.height = h + 'px';
  };
  const up = () => {
    if (!itOcr.drawing) return;
    itOcr.drawing = false;
    const r = itOcr.selEl.getBoundingClientRect();
    if (r.width < 8 || r.height < 8){ itOcr.selEl.style.display='none'; return; }
    // 转换为矫正后图原始坐标
    const sc = itOcr.canvas.width / itOcr.canvas.clientWidth;
    itOcr.rect = {
      x: Math.round((r.left - itOcr.canvas.getBoundingClientRect().left) * sc),
      y: Math.round((r.top - itOcr.canvas.getBoundingClientRect().top) * sc),
      w: Math.round(r.width * sc),
      h: Math.round(r.height * sc)
    };
    invOcrUpdateHint('已选区域 '+itOcr.rect.w+'×'+itOcr.rect.h+'，点「识别当前框」开始 OCR');
  };
  itOcr.canvas.addEventListener('mousedown', down);
  itOcr.canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  itOcr.canvas.addEventListener('touchstart', down, {passive:false});
  itOcr.canvas.addEventListener('touchmove', move, {passive:false});
  itOcr.canvas.addEventListener('touchend', up);

  invOcrUpdateHint('照片已处理。在图上拖动画框框选要识别的区域（可框多次），完成后点「识别当前框」。');
}

function invOcrRectReset(){
  if (itOcr.selEl){ itOcr.selEl.style.display='none'; }
  itOcr.rect = null;
}

// ---------- 点击四角矫正 ----------
// 在「当前显示图」上依次点 左上→右上→右下→左下 四个角，角点坐标即当前画面像素坐标，
// 直接交给后端 --from-warp 基于 warp.jpg 重矫正，坐标零偏移。
function invOcrStartCornerCapture(){
  if (!itOcr.canvas) return;
  if (itOcr.capturingCorners){
    invOcrEndCornerCapture();
    invOcrUpdateHint('已取消点击四角。在图上拖动画框框选要识别的区域。');
    return;
  }
  invOcrDetachCornerListeners();
  itOcr.capturingCorners = true;
  itOcr.corners = [];
  itOcr._lastCornerT = 0;
  if (itOcr.selEl) itOcr.selEl.style.display = 'none';
  itOcr.rect = null;
  invOcrEndCornerCaptureLayer();
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('id','itOcrCornerSvg');
  svg.setAttribute('viewBox','0 0 '+window.innerWidth+' '+window.innerHeight);
  svg.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10000;';
  svg.innerHTML = '<polyline id="itOcrCornerLine" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 4" points=""></polyline>';
  document.body.appendChild(svg);
  itOcr.cornerLayer = svg;
  itOcr.canvas.style.cursor = 'crosshair';
  invOcrUpdateHint('点击矫正：依次点「左上→右上→右下→左下」四个角，自动重矫正画面（再点「点击四角」可取消）');
  itOcr._cornerClick = (e) => invOcrRecordCorner(e.clientX, e.clientY);
  itOcr._cornerTouch = (e) => { if (e.changedTouches && e.changedTouches.length){ const t = e.changedTouches[0]; invOcrRecordCorner(t.clientX, t.clientY); } e.preventDefault(); };
  itOcr.canvas.addEventListener('click', itOcr._cornerClick);
  itOcr.canvas.addEventListener('touchend', itOcr._cornerTouch, {passive:false});
}

function invOcrRecordCorner(vx, vy){
  if (!itOcr.capturingCorners) return;
  const rect = itOcr.canvas.getBoundingClientRect();
  const sc = itOcr.canvas.width / itOcr.canvas.clientWidth;
  const bx = Math.round((vx - rect.left) * sc);
  const by = Math.round((vy - rect.top) * sc);
  itOcr.corners.push([bx, by]);
  invOcrDrawCorner(vx, vy, itOcr.corners.length);
  if (itOcr.corners.length >= 4){
    const cs = itOcr.corners.slice();
    invOcrEndCornerCapture();
    invOcrApplyRewarp(cs);
  }
}

function invOcrDrawCorner(vx, vy, idx){
  const svg = itOcr.cornerLayer; if (!svg) return;
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx', vx); c.setAttribute('cy', vy); c.setAttribute('r', 9);
  c.setAttribute('fill', '#22d3ee'); c.setAttribute('stroke', '#0e7490'); c.setAttribute('stroke-width', 2);
  svg.appendChild(c);
  const label = document.createElementNS('http://www.w3.org/2000/svg','text');
  label.setAttribute('x', vx + 13); label.setAttribute('y', vy + 4);
  label.setAttribute('fill', '#e0f2fe'); label.setAttribute('font-size', '13');
  label.textContent = ['左上','右上','右下','左下'][idx-1];
  svg.appendChild(label);
  const line = svg.querySelector('#itOcrCornerLine');
  const pts = line.getAttribute('points') ? line.getAttribute('points') + ' ' : '';
  line.setAttribute('points', pts + vx + ',' + vy);
}

function invOcrDetachCornerListeners(){
  if (itOcr._cornerClick && itOcr.canvas){
    itOcr.canvas.removeEventListener('click', itOcr._cornerClick);
    itOcr.canvas.removeEventListener('touchend', itOcr._cornerTouch);
  }
  itOcr._cornerClick = null; itOcr._cornerTouch = null;
}

function invOcrEndCornerCapture(){
  itOcr.capturingCorners = false;
  invOcrDetachCornerListeners();
  invOcrEndCornerCaptureLayer();
  if (itOcr.canvas) itOcr.canvas.style.cursor = '';
}

function invOcrEndCornerCaptureLayer(){
  if (itOcr.cornerLayer){ itOcr.cornerLayer.remove(); itOcr.cornerLayer = null; }
}

async function invOcrApplyRewarp(corners){
  itOcr.capturingCorners = false;
  invOcrDetachCornerListeners();
  invOcrEndCornerCaptureLayer();
  if (itOcr.canvas) itOcr.canvas.style.cursor = '';
  try {
    invOcrUpdateHint('矫正中…');
    const body = {sessionId: itOcr.sessionId, whiteBalance: itOcr.wb, corners, fromWarp: true};
    const r = await fetch(invAPI('ocr/rewarp'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!j.ok){ invOcrUpdateHint('重矫失败：'+j.error); return; }
    itOcr.warpW = j.width; itOcr.warpH = j.height;
    const url = j.imageUrl + (j.imageUrl.includes('?')?'&':'?') + 't=' + Date.now();
    await invOcrBuildOverlay(url);
    invOcrRectReset();
    invOcrUpdateHint('已按点击四角重新透视矫正。请重新框选要识别的区域。');
  } catch (e) { invOcrUpdateHint('重矫失败：'+e.message); }
}


function invOcrUpdateHint(s){
  if (!itOcr.overlay) return;
  const h = itOcr.overlay.querySelector('#itOcrHint');
  if (h) h.textContent = s;
}

async function invOcrSwitchWb(wb){
  itOcr.wb = wb;
  itOcr.overlay.querySelectorAll('#itOcrWb button').forEach(b => b.classList.toggle('active', b.dataset.wb===wb));
  try {
    const r = await fetch(invAPI('ocr/rewarp'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sessionId: itOcr.sessionId, whiteBalance: wb})});
    const j = await r.json();
    if (!j.ok){ invOcrUpdateHint('切换失败：'+j.error); return; }
    itOcr.warpW = j.width; itOcr.warpH = j.height;
    const url = j.imageUrl + (j.imageUrl.includes('?')?'&':'?') + 't=' + Date.now();
    const im = new Image(); im.crossOrigin = 'anonymous';
    await new Promise((res,rej)=>{ im.onload=res; im.onerror=rej; im.src=url; });
    itOcr.img = im;
    itOcr.canvas.width = im.naturalWidth; itOcr.canvas.height = im.naturalHeight;
    const wrap = itOcr.overlay.querySelector('#itOcrWrap');
    const maxW = wrap.clientWidth - 24;
    if (im.naturalWidth > maxW){
      const sc = maxW / im.naturalWidth;
      itOcr.canvas.style.width = (im.naturalWidth*sc)+'px';
      itOcr.canvas.style.height = (im.naturalHeight*sc)+'px';
    } else { itOcr.canvas.style.width=''; itOcr.canvas.style.height=''; }
    itOcr.ctx.drawImage(im, 0, 0);
    itOcr.rect = null; itOcr.pendingRois = []; invOcrRectReset();
    invOcrUpdateHint('已切换白平衡：'+(wb==='gray'?'灰世界':(wb==='white'?'白点':'关闭'))+'。请框选要识别的区域。');
  } catch (e) { invOcrUpdateHint('切换失败：'+e.message); }
}

function invOcrRewarp(){
  // 「手动四角」数字输入面板已移除（2026-09-03）；矫正功能保留「点击四角」入口。
}



async function invOcrRecognize(){
  const rois = (itOcr.pendingRois || []).slice();
  if (itOcr.rect) rois.push({...itOcr.rect});
  if (!rois.length){ toast('请先在图上画框'); return; }
  // 后端契约：rois = [[x,y,w,h], ...]（矫正后图坐标系）。前端存的是对象，发送前转成数组。
  const arr = rois.map(r => [r.x|0, r.y|0, r.w|0, r.h|0]);
  await invOcrRecognizeRoi(arr);
  itOcr.pendingRois = [];
  invOcrRectReset();
}

async function invOcrRecognizeRoi(rois){
  invOcrUpdateHint('识别中…');
  try {
    const r = await fetch(invAPI('ocr/recognize'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sessionId: itOcr.sessionId, rois})});
    const j = await r.json();
    if (!j.ok){ invOcrUpdateHint('识别失败：'+j.error); return; }
    let added = 0;
    (j.items||[]).forEach(it => {
      itOcr.results.push({code: it.code||'', info: it.materialInfo||'', hint: it.codeHint||'', existing: it.existing||null, raw: it.lines||[]});
      if (it.existing){ itOcr.existing.push(it.existing); }
      added++;
    });
    invOcrUpdateHint('本次识别出 ' + added + ' 条（已累加到下方表单，可继续画框识别更多，或点「使用这 N 条」确认）');
    invOcrRenderResults();
  } catch (e) { invOcrUpdateHint('识别失败：'+e.message); }
}

function invOcrRenderResults(){
  const box = itOcr.overlay.querySelector('#itOcrResults');
  if (!itOcr.results.length){
    box.innerHTML = '<div style="color:#94a3b8;font-size:12.5px;text-align:center;padding:10px 0;">尚无识别结果。画框后点「识别当前框」。</div>';
    itOcr.overlay.querySelector('#itOcrActs').style.display = 'none';
    return;
  }
  box.innerHTML = itOcr.results.map((r,i) => {
    const hasDup = !!r.existing;
    const badCode = r.hint && r.hint.indexOf('未识别') >= 0;
    return `
      <div class="it-ocr-result ${hasDup?'existing':''}">
        <div class="it-ocr-result-head">
          <div class="idx">#${i+1}</div>
          <input value="${invE(r.code)}" oninput="itOcr.results[${i}].code=this.value" placeholder="编码（10 位数字）" class="${badCode?'bad':''}">
          <div class="del" onclick="itOcr.results.splice(${i},1);invOcrRenderResults();">✕</div>
        </div>
        <div class="it-ocr-result-body">
          <textarea oninput="itOcr.results[${i}].info=this.value" placeholder="材料信息（文字描述）">${invE(r.info)}</textarea>
        </div>
        <div class="it-ocr-result-foot">
          ${r.hint ? `<span class="badge warn">⚠ ${invE(r.hint)}</span>` : ''}
          ${hasDup ? `<span class="badge dup">库内已存在 #${r.existing.id}</span> <span class="goto" onclick="invOcrGoExisting(${r.existing.id})">→ 跳转到该材料</span>` : '<span class="badge">✓ 待录入</span>'}
        </div>
      </div>`;
  }).join('');
  itOcr.overlay.querySelector('#itOcrActs').style.display = 'flex';
  itOcr.overlay.querySelector('#itOcrCount').textContent = itOcr.results.length;
}

// 应用内确认对话框：替代原生 confirm，减少系统提示
function invOcrConfirmDialog(msg){
  return new Promise((resolve) => {
    const mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:99999;';
    mask.innerHTML = `
      <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;width:280px;box-shadow:0 10px 30px rgba(0,0,0,.4);">
        <div style="color:#e2e8f0;font-size:14px;line-height:1.5;margin-bottom:16px;white-space:pre-wrap;">${msg}</div>
        <div style="display:flex;gap:10px;">
          <button type="button" id="itCnOk" style="flex:1;padding:10px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;cursor:pointer;">确定</button>
          <button type="button" id="itCnNo" style="flex:1;padding:10px;border:none;border-radius:8px;background:#475569;color:#fff;font-size:14px;cursor:pointer;">取消</button>
        </div>
      </div>`;
    document.body.appendChild(mask);
    const close = (v) => { mask.remove(); resolve(v); };
    mask.querySelector('#itCnOk').onclick = () => close(true);
    mask.querySelector('#itCnNo').onclick = () => close(false);
    mask.onclick = (e) => { if (e.target === mask) close(false); };
  });
}

async function invOcrGoExisting(id){
  const ok = await invOcrConfirmDialog('跳转到该材料详情？\n（当前识别结果将保留，但后续操作在该材料上继续）');
  if (!ok) return;
  invOcrClose();
  invOpenDetail(id);
}

function invOcrConfirm(){
  const items = itOcr.results.map(r => ({code: (r.code||'').trim(), materialInfo: (r.info||'').trim()}))
    .filter(r => r.code || r.materialInfo);
  if (!items.length){ toast('没有有效结果可使用'); return; }
  invOcrClose();
  if (typeof itOcr.callback === 'function') invOcrCallbackWrap(itOcr.callback, items);
  // 回调结束后若用户选择"跳转到某材料"，由 invOcrGoExisting 处理
}

function invOcrCallbackWrap(cb, items){
  // 将识别结果交给调用方回调（当前仅有 invOcrFillCreate 单条填充；批量模式由调用方自行处理）
  if (typeof cb === 'function') cb(items);
}

function invOcrClose(){
  itOcr.capturingCorners = false; itOcr.corners = []; itOcr._lastCornerT = 0;
  invOcrDetachCornerListeners();
  invOcrEndCornerCaptureLayer();
  if (itOcr.overlay){ itOcr.overlay.remove(); itOcr.overlay = null; }
  itOcr.canvas = null;
  itOcr.img = null; itOcr.rect = null;
  itOcr.pendingRois = []; itOcr.results = []; itOcr.existing = []; itOcr.sessionId = null;
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const _INV_VOID = {input:1,br:1,img:1,hr:1,meta:1,link:1,source:1,area:1,base:1,col:1,embed:1,param:1,track:1,wbr:1};
function invEl(tag, a, ...rest){
  let attrs = null, children = rest;
  if (a !== undefined && a !== null && typeof a === 'object' && !Array.isArray(a) && Object.prototype.toString.call(a) === '[object Object]'){
    attrs = a;
  } else {
    children = [a, ...rest];
  }
  let html = '<' + tag;
  if (attrs){
    for (const k in attrs){
      const v = attrs[k];
      if (v == null || v === false) continue;
      const val = String(v);
      if (k === 'class') html += ' class="' + escAttr(val) + '"';
      else if (k === 'style') html += ' style="' + escAttr(val) + '"';
      else if (k.startsWith('on')) html += ' ' + k + '="' + escAttr(val) + '"';
      else if (k === 'value') html += ' value="' + escAttr(val) + '"';
      else if (k === 'for') html += ' for="' + escAttr(val) + '"';
      else html += ' ' + k + '="' + escAttr(val) + '"';
    }
  }
  html += '>';
  if (_INV_VOID[tag]) return html;
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    html += String(c);
  });
  html += '</' + tag + '>';
  return html;
}

(function(){
  try{
    const qs = new URLSearchParams(location.search);
    const deepMod = qs.get('mod');
    const deepModel = qs.get('model');
    const deepPage = qs.get('page');
    if (deepMod && (deepModel || deepPage)){
      const _ok = setInterval(() => {
        if (modulesCache.length > 0){
          clearInterval(_ok);
          if (modulesCache.find(m => m.key === deepMod)){
            openModule(deepMod);  // 进入模块菜单
            setTimeout(() => {
              if (deepMod === 'defecthistory'){
                const deepMonth = qs.get('month') || undefined;
                if (deepPage === 'analysis'){
                  _navPush('dh-analysis', '数据分析', () => dhPageAnalysis(deepMonth), null); dhPageAnalysis(deepMonth);   // 直达数据分析页并自动生成
                  return;
                }
                _navPush('dh-query', '型号查询', dhPageQuery, null); dhPageQuery();                       // 直接进查询页
                const el = $('#dhQModel');
                if (el){
                  el.value = deepModel;
                  const m = deepMonth;
                  if (m){ const sel = $('#dhQMonth'); if (sel && Array.from(sel.options).some(o => o.value === m)) sel.value = m; }
                  dhDoQuery();
                }
              }
            }, 350);
          }
        }
      }, 150);
    }
  }catch(e){ /* 深链接失败不影响正常使用 */ }
})();
