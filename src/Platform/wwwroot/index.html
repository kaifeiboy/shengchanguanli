<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>打标首件比对</title>
<script src="jsqr.js?v=3"></script>
<script src="quagga.min.js?v=2"></script>
<script src="zxing-library.min.js?v=1"></script>
<style>
  :root{
    --bg:#f0f4f8; --txt:#1a2332; --sub:#6b7a8a;
    --card:#ffffff; --line:#e2e8f0; --pri:#2c6feb;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:14px;
    --ele1:0 2px 8px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --ele2:0 4px 16px rgba(44,111,235,.15), 0 2px 4px rgba(44,111,235,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  canvas{touch-action:none;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);overscroll-behavior-x:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{min-height:100vh;background-image:radial-gradient(ellipse at 50% 0%, rgba(44,111,235,.04) 0%, transparent 60%);}
  .wrap{max-width:540px;margin:0 auto;padding:0 6px 20px;display:flex;flex-direction:column;min-height:100vh;}

  /* 顶部行：模块功能标签栏（左）+ 更多按钮（右）同一水平线 */
  .top-bar{display:flex;align-items:center;gap:8px;padding:12px 8px 4px;flex:none;}
  /* 顶栏 - 模块大标题（置于标签栏下方，居中） */
  header.top{text-align:center;padding:8px 0 6px;flex:none;}
  header.top h1{font-size:22px;font-weight:800;letter-spacing:1.4px;color:var(--txt);margin:0;
    background:linear-gradient(135deg, var(--txt) 0%, var(--pri) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;}
  header.top .top-sub{font-size:13px;color:var(--sub);margin-top:4px;letter-spacing:2px;}
  .more-btn{flex:none;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:18px;font-weight:700;cursor:pointer;box-shadow:var(--ele1);}
  .more-btn:active{transform:scale(.93);}

  .hide{display:none !important;}

  /* 模块功能标签栏（顶部行左侧，占满、可横向滚动） */
  .mod-tabs{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;}
  .mod-tab{flex:none;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);}
  .mod-tab.active{background:var(--pri);color:#fff;border-color:var(--pri);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;box-shadow:var(--ele1);}
  .card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--txt);}
  .card h3 .em{font-size:18px;}


  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:13px 16px;border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;
    background:var(--pri);cursor:pointer;transition:.18s;}
  .btn:active{transform:scale(.98);opacity:.92;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt);font-weight:600;}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px;}
  .btn.block-blue{background:var(--pri);color:#fff;}

  .entry-row{display:flex;gap:12px;}
  .entry{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;box-shadow:var(--ele1);cursor:pointer;transition:.18s;}
  .entry:active{transform:scale(.98);border-color:var(--pri);}
  .entry .e-ic{font-size:24px;}
  .entry .e-t{font-size:14px;font-weight:700;color:var(--txt);}
  .entry .e-s{font-size:11.5px;color:var(--sub);margin-top:2px;}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back{font-size:13px;color:var(--pri);cursor:pointer;padding:7px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);font-weight:600;}
  .back:active{transform:scale(.97);}

  /* 🆕 立体功能按钮 - 大图标居中 */
  .feat-btn{display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:.2s;}
  .feat-btn:active{transform:scale(.93);}
  .feat-btn .feat-ic{width:76px;height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-size:34px;color:#fff;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.25);}
  .feat-btn .feat-ic::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;
    background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 100%);
    border-radius:20px 20px 0 0;pointer-events:none;}
  .feat-btn.feat-l .feat-ic{width:100px;height:100px;border-radius:26px;font-size:44px;}
  .feat-btn.feat-l .feat-ic::after{border-radius:26px 26px 0 0;}
  .feat-btn .feat-lb{font-size:14px;font-weight:600;color:var(--txt);letter-spacing:.5px;}
  .feat-btn.feat-l .feat-lb{font-size:17px;font-weight:700;}

  label.fld{display:block;font-size:12.5px;color:var(--sub);margin:0 0 6px;}
  input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--txt);font-size:15px;outline:none;}
  input[type=text]:focus{border-color:var(--pri);}

  /* 自定义下拉（手机端兼容：datalist 在多数移动浏览器不可用） */
  .dh-dd{position:relative;width:100%;}
  .dh-dd input{padding-right:34px;}
  .dh-dd-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border:none;background:transparent;color:var(--sub);
    font-size:14px;cursor:pointer;line-height:1;border-radius:8px;}
  .dh-dd-btn:active{background:#eef2f7;}
  .dh-dd-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;
    background:#fff;border:1px solid var(--line);border-radius:12px;
    max-height:220px;overflow:auto;box-shadow:0 8px 24px rgba(15,23,42,.12);}
  .dh-dd-item{padding:11px 14px;font-size:14.5px;color:var(--txt);cursor:pointer;
    border-bottom:1px solid #f1f5f9;}
  .dh-dd-item:last-child{border-bottom:none;}
  .dh-dd-item:active,.dh-dd-item.sel{background:#eef4ff;color:var(--pri);}
  .dh-dd-item.new{color:var(--pri);font-weight:600;}

  .up-row{display:flex;gap:12px;margin-bottom:4px;}
  .up-card{display:flex;flex-direction:column;align-items:center;gap:6px;
    flex:1;border:1.5px solid var(--line);border-radius:14px;padding:16px 10px;color:var(--sub);
    font-size:12px;text-align:center;background:#fff;transition:.18s;cursor:pointer;}
  .up-card:active,.up-card:hover{border-color:var(--pri);background:#f5f8ff;}
  .up-card input{display:none;}
  .up-card .big{font-size:28px;}
  .up-card b{color:var(--txt);font-size:14px;font-weight:700;}

  .list{max-height:52vh;overflow:auto;margin-top:4px;}
  .item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
    background:#fff;border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.18s;}
  .item:active{transform:scale(.99);border-color:var(--pri);background:#f5f8ff;}
  .item .meta{flex:1;min-width:0;}
  .item .fn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);}
  .item .md{font-size:12px;color:var(--sub);margin-top:3px;}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;margin-left:6px;}
  .tag.ok{background:rgba(22,163,74,.12);color:var(--ok);}
  .tag.part{background:rgba(217,119,6,.12);color:var(--warn);}
  .tag.lan{background:rgba(37,99,235,.12);color:var(--pri);}
  .tag.ext{background:rgba(37,99,235,.10);color:var(--pri);}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0;}
  .meta-line{font-size:12.5px;color:var(--sub);margin:2px 0;}
  .meta-line b{color:var(--txt);}

  .spinner{width:18px;height:18px;border:2.5px solid rgba(31,41,55,.18);border-top-color:var(--pri);
    border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#ffffff;
    border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13.5px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;font-weight:600;}
  .toast.show{opacity:1;}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:10px;}

  /* 选图纸 底部弹层 */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;opacity:0;visibility:hidden;transition:.25s;}
  .overlay.show{opacity:1;visibility:visible;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:18px 18px 0 0;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s ease;
    max-width:540px;margin:0 auto;box-shadow:0 -4px 20px rgba(0,0,0,.12);}
  .sheet.show{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .sheet-head .s-title{font-size:16px;font-weight:800;flex:1;}
  .sheet-head .s-close{font-size:20px;color:var(--sub);cursor:pointer;padding:4px 8px;}

  /* 更多 右侧滑入面板 */
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:60;width:84%;max-width:360px;background:#fff;
    transform:translateX(100%);transition:transform .28s ease;box-shadow:-4px 0 20px rgba(0,0,0,.12);
    display:flex;flex-direction:column;}
  .drawer.show{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line);}
  .drawer-head .d-title{font-size:16px;font-weight:800;flex:1;}
  .drawer-head .d-close{font-size:20px;color:var(--sub);cursor:pointer;padding:4px 8px;}
  .menu-list{padding:10px 12px;}
  .menu-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;font-size:15px;
    font-weight:600;cursor:pointer;color:var(--txt);transition:.18s;background:var(--card);border:1px solid var(--line);margin-bottom:8px;}
  .menu-item:active{background:#f5f8ff;}
  .menu-item .mi-ic{font-size:18px;}
  .menu-body{flex:1;overflow:auto;padding:14px 16px 24px;}
  .menu-body.hide{display:none;}
  #toolBody{max-height:72vh;overflow:auto;}
  .menu-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--pri);
    cursor:pointer;font-weight:600;margin-bottom:10px;}

  .addr-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;background:#fff;}
  .addr-row .addr-url{font-size:13px;color:var(--txt);word-break:break-all;margin-top:4px;}
  .mod-list{margin-top:6px;}
  .mod-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--txt);}
  .mod-item .mod-ic{font-size:20px;}

  /* 维修解绑模块 - 移动端专用样式 */
  .unbind-wrap{display:flex;flex-direction:column;height:100%;}
  .unbind-card{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:14px;margin-bottom:12px;}
  .unbind-row{display:flex;align-items:center;margin-bottom:10px;}
  .unbind-row:last-child{margin-bottom:0;}
  .unbind-row label{width:30%;font-size:14px;color:#606266;font-weight:500;padding-right:8px;white-space:nowrap;}
  .unbind-row input{flex:1;width:70%;height:44px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:15px;outline:none;background:#fff;color:#303133;}
  .unbind-row input:focus{border-color:#1890ff;}
  .unbind-row input::placeholder{color:#c0c4cc;}
  .unbind-list{flex:1;overflow:auto;padding-bottom:80px;}
  .unbind-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:12px 14px;margin-bottom:10px;border:2px solid transparent;}
  .unbind-item.sel{border-color:#1890ff;background:#f0f7ff;}
  .ub-chk{flex:0 0 auto;padding-top:2px;}
  .ub-chk input{width:20px;height:20px;margin:0;}
  .ub-body{flex:1 1 auto;min-width:0;}
  .unbind-item-line{font-size:14px;color:#303133;line-height:1.6;word-break:break-all;margin-bottom:4px;}
  .unbind-item-line label{color:#909399;font-size:13px;margin-right:6px;}
  .ub-prod{color:#606266;}
  .unbind-item-time{font-size:13px;color:#909399;margin-top:6px;text-align:right;}
  .unbind-bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;height:56px;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.08);max-width:540px;margin:0 auto;}
  .unbind-bottom button{flex:1;border:none;font-size:15px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:56px;}
  .unbind-bottom button:active{opacity:.88;}
  .unbind-bottom .btn-search{background:#1890ff;}
  .unbind-bottom .btn-outer{background:#fa8c16;}
  .unbind-bottom .btn-repair{background:#f5222d;}
  .unbind-bottom .btn-usage{background:#722ed1;}
  .unbind-empty{text-align:center;color:#909399;font-size:14px;padding:30px 0;}
  /* 错误横幅：区分网络不通/中转未起/目标系统不通/鉴权过期/超时 */
  .unbind-error{border-radius:10px;padding:18px 16px;margin:16px 12px;text-align:center;border:1px solid;}
  .unbind-error .ue-icon{font-size:36px;display:block;margin-bottom:8px;}
  .unbind-error .ue-title{font-size:16px;font-weight:700;display:block;margin-bottom:6px;}
  .unbind-error .ue-detail{font-size:13px;line-height:1.5;display:block;word-break:break-all;}
  .unbind-error.e-network{background:#fff2f0;border-color:#ffccc7;}
  .unbind-error.e-network .ue-title{color:#cf1322;}
  .unbind-error.e-network .ue-detail{color:#8c1414;}
  .unbind-error.e-proxy{background:#fff7e6;border-color:#ffd591;}
  .unbind-error.e-proxy .ue-title{color:#d46b08;}
  .unbind-error.e-proxy .ue-detail{color:#873800;}
  .unbind-error.e-target{background:#fff2f0;border-color:#ffccc7;}
  .unbind-error.e-target .ue-title{color:#cf1322;}
  .unbind-error.e-target .ue-detail{color:#8c1414;}
  .unbind-error.e-auth{background:#f6ffed;border-color:#b7eb8f;}
  .unbind-error.e-auth .ue-title{color:#389e0d;}
  .unbind-error.e-auth .ue-detail{color:#237804;}
  .unbind-error.e-timeout{background:#fffbe6;border-color:#ffe58f;}
  .unbind-error.e-timeout .ue-title{color:#ad6800;}
  .unbind-error.e-timeout .ue-detail{color:#614700;}
  .unbind-error.e-server{background:#fff1f0;border-color:#ffa39e;}
  .unbind-error.e-server .ue-title{color:#cf1322;}
  .unbind-error.e-server .ue-detail{color:#8c1414;}
  /* 使用记录面板 */
  .usage-log{padding:0;}
  .usage-item{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);}
  .usage-item:last-child{border-bottom:none;}
  .usage-ic{font-size:20px;flex:0 0 auto;width:28px;text-align:center;}
  .usage-body{flex:1;min-width:0;}
  .usage-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .usage-act{font-size:14px;font-weight:600;color:var(--txt);}
  .usage-time{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap;}
  .usage-desc{font-size:13px;color:#606266;line-height:1.5;word-break:break-all;}
  .usage-badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;font-weight:600;}
  .usage-badge.ok{background:#f6ffed;color:#389e0d;border:1px solid #b7eb8f;}
  .usage-badge.fail{background:#fff2f0;color:#cf1322;border:1px solid #ffccc7;}
  .usage-clear{margin:16px 0;padding:10px 16px;text-align:center;font-size:14px;color:#ff4d4f;border:1px solid #ffa39e;border-radius:10px;cursor:pointer;background:#fff1f0;}
  .usage-clear:active{background:#ffccc7;}
  .unbind-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:#909399;margin-bottom:10px;}
  .unbind-hint{font-size:12px;color:#909399;line-height:1.5;margin-top:8px;padding:8px;background:#f5f7fa;border-radius:6px;}
  /* 扫码按钮 + 取景弹层 */
  .ub-scan{width:40px;height:40px;margin-left:8px;flex:0 0 auto;border:1px solid #dcdfe6;border-radius:6px;background:#f5f7fa;font-size:18px;line-height:40px;cursor:pointer;padding:0;}
  .ub-scan:active{background:#e9eef5;}
  .scan-modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;}
  .scan-modal.show{display:flex;}
  .scan-wrap{position:relative;width:84vw;max-width:420px;height:84vw;max-height:420px;}
  .scan-video{width:100%;height:100%;object-fit:cover;border-radius:12px;background:#000;}
  .scan-frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;height:70%;border:2px solid #1890ff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border-radius:10px;pointer-events:none;}
  .scan-msg{color:#fff;font-size:14px;margin-top:16px;text-align:center;padding:0 20px;line-height:1.6;}
  .scan-close{margin-top:18px;border:none;background:#1890ff;color:#fff;font-size:15px;font-weight:700;padding:10px 26px;border-radius:24px;cursor:pointer;}
  .scan-close:active{opacity:.88;}
  .scan-capture{margin-top:12px;border:none;background:#52c41a;color:#fff;font-size:15px;font-weight:700;padding:10px 26px;border-radius:24px;cursor:pointer;}
  .scan-capture:active{opacity:.88;}
  .scan-capture:disabled{background:#999;}

  /* ===== 不良履历查询模块：结果行 + 批量操作 ===== */
  /* 自动分析提醒条（每月 2 号生成上月报告后提示查看/下载） */
  .dh-reminder{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    padding:9px 12px;margin:0 0 10px;background:#eff6ff;border:1px solid rgba(37,99,235,.25);border-radius:10px;
    font-size:13px;color:#1d4ed8;}
  .dh-reminder .dh-rem-go{color:#2563eb;font-weight:700;text-decoration:underline;cursor:pointer;padding:2px 6px;}
  .dh-batch-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:8px 10px;margin:0 0 8px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;}
  .dh-batch-bar .btn.sm{padding:7px 12px;font-size:12.5px;}
  /* 隧道健康条已移除（用户反馈取消外网隧穿提示） */
  .dh-sel-all{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--txt);font-weight:600;cursor:pointer;}
  .dh-sel-all input{width:16px;height:16px;cursor:pointer;}
  .dh-sel-count{margin-left:auto;font-size:12.5px;color:var(--sub);}
  .dh-row{display:flex;align-items:flex-start;gap:8px;
    background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;transition:.15s;}
  .dh-row-sel{background:#fff8f5;border-color:rgba(220,38,38,.35);}
  .dh-row .dh-cb{flex:none;width:18px;height:18px;margin-top:2px;cursor:pointer;}
  .dh-row-text{flex:1;min-width:0;}
  .dh-row-img{flex:none;display:flex;align-items:center;justify-content:center;
    min-width:130px;max-width:160px;min-height:90px;}
  .dh-row-img img.dh-thumb{display:block;width:100%;max-width:160px;max-height:220px;
    object-fit:contain;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff;}
  .dh-row-img .tag{padding:6px 12px;}
  /* 图片加载态 / 错误态 */
  .dh-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;
    min-width:130px;min-height:90px;}

    object-fit:contain;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff;}
  .dh-img-wrap .dh-img-spin{width:22px;height:22px;border:2.5px solid rgba(31,41,55,.15);
    border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite;}
  .dh-img-wrap.dh-loading img.dh-thumb{visibility:hidden;}
  .dh-img-wrap.dh-loading::after{content:'';position:absolute;width:22px;height:22px;
    border:2.5px solid rgba(31,41,55,.15);border-top-color:var(--pri);border-radius:50%;
    animation:spin .7s linear infinite;}
  .dh-img-wrap.dh-error img.dh-thumb{display:none;}
  .dh-img-err-txt{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--bad);
    padding:8px 10px;border:1px dashed rgba(220,38,38,.4);border-radius:8px;cursor:pointer;background:#fff7f5;}

  /* ===== 库存尾数模块（v2 独立重建 · Key=invtail）===== */
  .it-card{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;}
  .it-field{display:flex;flex-direction:column;gap:5px;}

  .it-field>label .req{color:var(--bad);font-weight:700;}
  .it-field input,.it-field select,.it-field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px;outline:none;box-sizing:border-box;}
  .it-field textarea{resize:vertical;min-height:60px;font-size:14px;}
  .it-field input:focus,.it-field select:focus,.it-field textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(44,111,235,.1);}
  .it-hint{font-size:12px;color:var(--sub);padding:2px 0 6px;line-height:1.5;}
  .it-hint.warn{color:var(--warn);}
  .it-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .it-row .it-field{flex:1;min-width:120px;}
  .it-list{max-height:54vh;overflow:auto;}
  .it-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .it-item:active{transform:scale(.99);border-color:var(--pri);background:#f5f8ff;}
  .it-item-text{flex:1;min-width:0;}
  .it-item-bin{font-size:18px;color:var(--pri);font-weight:800;letter-spacing:.5px;line-height:1.1;}
  .it-item-name{font-size:14px;font-weight:700;color:var(--txt);word-break:break-all;margin-top:1px;}
  .it-item-meta{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .it-stock{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:64px;}
  .it-stock-val{font-size:18px;font-weight:800;color:var(--ok);}
  .it-stock-val.zero{color:var(--warn);}
  .it-stock-lbl{font-size:11px;color:var(--sub);}

  .it-movebar{display:flex;gap:8px;align-items:flex-end;padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;}
  .it-movebar select,.it-movebar input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;color:var(--txt);min-width:0;}
  .it-movebar .it-dir{width:80px;}
  .it-movebar .it-qty{width:90px;}
  .it-movebar .it-handler{flex:1;min-width:120px;}
  .it-movebar .it-note{flex:1;min-width:120px;}
  .it-movebar .it-act{flex:0;}

  /* 经手人输入框 + 下拉 + 管理入口（.it-handler-field）*/
  .it-handler-field{position:relative;display:flex;align-items:center;gap:6px;}
  .it-handler-field input{flex:1;min-width:0;}
  .it-handler-field .it-handler-manage{flex:0 0 auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .it-handler-field .it-handler-manage:active{background:#f5f8ff;color:var(--pri);border-color:var(--pri);}

  .it-record{border-top:1px dashed var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start;}
  .it-record:first-of-type{border-top:none;padding-top:4px;}
  .it-record-tag{flex:0;min-width:48px;text-align:center;padding:4px 0;border-radius:6px;font-size:12px;font-weight:700;}
  .it-record-tag.in{background:rgba(22,163,74,.12);color:var(--ok);}
  .it-record-tag.out{background:rgba(220,38,38,.12);color:var(--bad);}
  .it-record-body{flex:1;min-width:0;}
  .it-record-line1{font-size:14px;color:var(--txt);font-weight:600;}
  .it-record-line1 .qty{color:var(--pri);font-weight:800;}
  .it-record-meta{font-size:12px;color:var(--sub);margin-top:2px;}
  .it-record-note{font-size:12px;color:var(--sub);margin-top:2px;font-style:italic;}
  .it-record-del{flex:0;align-self:center;color:var(--sub);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:12px;}
  .it-record-del:active{background:rgba(220,38,38,.08);color:var(--bad);}

  /* ===== 库存尾数·详情/新增 紧凑布局（第二轮）===== */
  .it-hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
  .it-hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .it-hero-cell{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .it-hero-label{font-size:12px;color:var(--sub);}
  .it-hero-value{font-size:15px;font-weight:700;color:var(--txt);word-break:break-all;}
  .it-hero-value.big{font-size:18px;font-weight:800;color:var(--pri);line-height:1.15;}
  .it-hero-cell.stock{background:rgba(44,111,235,.08);border-radius:10px;padding:8px 10px;}
  .it-hero-cell.stock .it-hero-label{color:var(--pri);font-weight:600;}
  .it-hero-stock-val{font-size:22px;font-weight:800;color:var(--pri);line-height:1.1;}
  .it-hero-stock-val.zero{color:var(--warn);}
  .it-hero-detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .it-hero-detail .it-hero-value{font-size:15px;font-weight:600;}

  /* 操作行（入库/出库 双列并列，输入框与按键连成一体，无独立方向标签） */
  .it-movebar.it-movebar-compact{padding:0;background:transparent;border:none;border-radius:0;gap:8px;flex-direction:column;align-items:stretch;}
  .it-move-grid{display:flex;flex-direction:row;gap:10px;}
  .it-move-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  /* 输入框 + 按键 连成一体的一体单元（绿=入库 / 红=出库） */
  .it-move-unit{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;border:2px solid;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .it-move-unit.in{border-color:var(--ok);background:#fff;}
  .it-move-unit.out{border-color:var(--bad);background:#fff;}
  .it-move-unit input{padding:12px 10px;border:none;border-radius:0;background:#fff;color:var(--txt);font-size:16px;text-align:center;outline:none;box-sizing:border-box;width:100%;min-width:0;}
  .it-move-unit.in input:focus{background:rgba(22,163,74,.05);}
  .it-move-unit.out input:focus{background:rgba(220,38,38,.05);}
  /* 按键突出：填满颜色、加粗、明显大于输入框，与输入框无缝隙连成一体 */
  .it-move-go{padding:12px 16px;border:none;border-radius:0;font-size:16px;font-weight:800;color:#fff;cursor:pointer;flex:0 0 auto;transition:.15s;white-space:nowrap;letter-spacing:1px;}
  .it-move-go.in{background:var(--ok);box-shadow:inset -1px 0 0 rgba(0,0,0,.08);}
  .it-move-go.out{background:var(--bad);box-shadow:inset -1px 0 0 rgba(0,0,0,.08);}
  .it-move-go:active{filter:brightness(.92);}
  .it-movebar.it-movebar-compact .it-hint{margin:-2px 0 0;}

  /* 备注 + 流水笔数 并列一行 */
  .it-act-row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px;}
  .it-act-row .it-note{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px;outline:none;box-sizing:border-box;}
  .it-act-row .it-note:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(44,111,235,.1);}
  .it-rec-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:2px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;color:var(--txt);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .it-rec-toggle::after{content:' ▾';font-size:12px;color:var(--sub);}
  .it-rec-toggle.open::after{content:' ▴';}
  .it-rec-collapsed{display:none;}

  /* 主按钮（查询/确认/确认新增/保存/生成Excel） */
  .it-btn-pri{padding:11px 18px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;}
  .it-btn-pri:active{transform:scale(.98);opacity:.92;}

  /* 历史操作明细 */
  .it-rec-head{font-size:13px;color:var(--sub);font-weight:600;padding:6px 2px 8px;}
  .it-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 0;color:var(--sub);font-size:13px;}
  .it-empty .ic{font-size:32px;opacity:.6;}
  .it-record-detail{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .it-record-top{display:flex;align-items:center;gap:8px;}
  .it-record-qty{font-size:15px;font-weight:800;}
  .it-record-qty.in{color:var(--ok);}
  .it-record-qty.out{color:var(--bad);}
  .it-record-bal{font-size:12.5px;color:var(--sub);}
  .it-record-info{margin-top:6px;font-size:12.5px;color:var(--sub);line-height:1.6;}
  .it-record-info .k{color:var(--txt);font-weight:600;}

  /* ===== 库存尾数·首页 紧凑布局 ===== */
  /* 参考线对齐：以空态提示「输入关键词搜索…」高度为基准，整体下移搜索框+两图标，
     使图标底部对齐该参考线。如需微调，只需改 padding-top 数值。 */
  .it-home-top{position:relative;margin-top:16px;padding-top:40px;}
  .it-search{display:flex;gap:8px;align-items:center;margin-bottom:14px;}
  .it-search-input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:15px;outline:none;box-sizing:border-box;}
  .it-search-input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(44,111,235,.1);}
  .it-search-btn{flex:0 0 auto;}
  .it-feat-row{display:flex;gap:12px;margin-bottom:14px;}
  .it-feat-row .feat-btn.feat-l{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:12px;padding:16px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:.15s;}
  .it-feat-row .feat-btn.feat-l:active{transform:scale(.98);background:#f5f8ff;}
  .it-feat-row .feat-btn.feat-l .feat-ic{width:56px;height:56px;border-radius:16px;font-size:28px;box-shadow:none;flex:0 0 auto;}
  .it-feat-row .feat-btn.feat-l .feat-ic::after{display:none;}
  .it-feat-row .feat-btn.feat-l .feat-lb{font-size:15px;font-weight:800;letter-spacing:0;line-height:1.1;white-space:nowrap;}
  .it-item{padding:10px;margin-bottom:6px;}
  .it-item-bin{font-size:18px;}
  .it-item-name{font-size:13.5px;}
  .it-stock-val{font-size:19px;}

  /* ---- 拍照 OCR 弹层 ---- */
  .it-ocr-overlay{position:fixed;inset:0;background:rgba(15,23,42,.85);z-index:9999;display:flex;flex-direction:column;}
  .it-ocr-top{padding:10px 14px;display:flex;align-items:center;gap:8px;background:#0f172a;color:#fff;flex-wrap:wrap;}
  .it-ocr-top .ttl{flex:1;font-weight:700;font-size:15px;}
  .it-ocr-top .btn{padding:6px 12px;border-radius:8px;border:1px solid #475569;background:#1e293b;color:#fff;font-size:13px;cursor:pointer;}
  .it-ocr-top .btn.pri{background:#2563eb;border-color:#3b82f6;}
  .it-ocr-top .btn.ok{background:var(--ok);border-color:var(--ok);}
  .it-ocr-top .btn:disabled{opacity:.5;cursor:not-allowed;}
  .it-ocr-wb{display:inline-flex;gap:4px;background:#1e293b;border-radius:8px;padding:3px;}
  .it-ocr-wb button{padding:4px 10px;border-radius:6px;border:0;background:transparent;color:#cbd5e1;font-size:12px;cursor:pointer;}
  .it-ocr-wb button.active{background:#2563eb;color:#fff;}
  .it-ocr-canvas-wrap{flex:1;overflow:auto;background:#1e293b;display:flex;align-items:flex-start;justify-content:center;padding:12px;}
  .it-ocr-canvas-wrap canvas{display:block;background:#fff;max-width:none;box-shadow:0 4px 24px rgba(0,0,0,.4);}
  .it-ocr-sel{position:absolute;border:2px dashed #2c6feb;background:rgba(44,111,235,.18);pointer-events:none;border-radius:4px;}
  .it-ocr-hint{position:absolute;color:#fff;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:4px;font-size:11px;pointer-events:none;}
  .it-ocr-bot{padding:10px 14px;background:#0f172a;color:#fff;display:flex;flex-direction:column;gap:8px;border-top:1px solid #334155;max-height:45vh;overflow:auto;}
  .it-ocr-results{display:flex;flex-direction:column;gap:6px;}
  .it-ocr-result{border:1px solid #475569;background:#1e293b;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;}
  .it-ocr-result.existing{border-color:#f59e0b;background:rgba(245,158,11,.1);}
  .it-ocr-result-head{display:flex;gap:6px;align-items:center;}
  .it-ocr-result-head .idx{flex:0;color:#fbbf24;font-weight:700;font-size:12px;min-width:32px;}
  .it-ocr-result-head input{flex:1;padding:7px 9px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none;}
  .it-ocr-result-head input.bad{border-color:#ef4444;}
  .it-ocr-result-head .del{flex:0;color:#94a3b8;font-size:18px;padding:0 6px;cursor:pointer;}
  .it-ocr-result-head .del:hover{color:#ef4444;}
  .it-ocr-result-body{display:flex;flex-direction:column;gap:5px;}
  .it-ocr-result-body textarea{width:100%;padding:7px 9px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:13px;outline:none;resize:vertical;min-height:38px;}
  .it-ocr-result-foot{display:flex;gap:6px;align-items:center;font-size:11.5px;color:#94a3b8;}
  .it-ocr-result-foot .badge{background:#475569;color:#cbd5e1;padding:2px 6px;border-radius:4px;font-size:10.5px;}
  .it-ocr-result-foot .badge.warn{background:#7c2d12;color:#fdba74;}
  .it-ocr-result-foot .badge.dup{background:#92400e;color:#fcd34d;}
  .it-ocr-result-foot .goto{margin-left:auto;color:#60a5fa;cursor:pointer;text-decoration:underline;font-size:12px;}
  .it-ocr-bot .actbar{display:flex;gap:8px;justify-content:flex-end;}
  .it-ocr-bot .btn{padding:7px 14px;border-radius:8px;border:0;background:#334155;color:#fff;font-size:13px;cursor:pointer;}
  .it-ocr-bot .btn.pri{background:#2563eb;}
  .it-ocr-bot .btn.ok{background:var(--ok);}

  /* 自适应手机：>=480px 单行操作栏，<480px 自动堆叠 */
  @media (max-width: 480px){
    .it-movebar{flex-direction:column;align-items:stretch;}
    .it-movebar .it-dir,.it-movebar .it-qty,.it-movebar .it-handler,.it-movebar .it-note,.it-movebar .it-act{width:100%;flex:1;}
    .it-row{flex-direction:column;align-items:stretch;}
    .it-row .it-field{min-width:0;}
  }
  /* 图片标注按钮 */
  .dh-at{padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#e2e8f0;color:#334155;font-size:12px;cursor:pointer;transition:.15s;}
  .dh-aa{padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#f1f5f9;color:#475569;font-size:12px;cursor:pointer;transition:.15s;}
  .dh-aa:hover{background:#e2e8f0;}
  /* 首页模块卡片 */
  .home-card{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;
    background:linear-gradient(145deg,#fff 0%,#f8fafc 100%);border:1px solid var(--line);border-radius:20px;
    padding:20px 16px;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .home-card:active{transform:scale(.96);box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .home-card .ic{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;position:relative;overflow:hidden;}
  .home-card .ic::after{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 100%);border-radius:20px 20px 0 0;}
  .home-card .lb{font-size:15px;font-weight:700;color:var(--txt);text-align:center;}
  .home-card .sub{font-size:11.5px;color:var(--sub);text-align:center;margin-top:2px;}
  /* 模块菜单页 */
  .menu-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.18s;}

  .menu-card .mc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex:none;}

  .menu-card .mc-desc{font-size:12px;color:var(--sub);margin-top:2px;}
  .menu-card .mc-arrow{font-size:20px;color:#cbd5e1;}
</style>

<body>
<div class="wrap" id="appWrap">
  <!-- 顶部标题栏（首页显示模块列表，模块内显示返回+标题） -->
  <div class="top-bar" id="topBar">

    <h1 id="pageTitle" style="margin:0;font-size:17px;font-weight:700;">生产管理</h1>

  <!-- 模块内容区 -->
  <section id="moduleRoot" style="flex:1;overflow-y:auto;"></section>

    <div class="s-title" id="toolTitle">管理</div>

<script>
// ---- 全局状态 ----

// ---- 页面导航历史栈 ----
// 设计原则：_navBack 与手势返回走同一条路径（浏览器历史回退 + popstate统一同步）
// _navPush 与 pushState 一一对应；popstate 根据 location.hash 在栈中定位并 slice
let _navStack = [];  // [{key, title, render, back}]

function _navPush(key, title, render, back){
  _navStack.push({key, title, render, back});
  history.pushState({key}, '', '#' + key);
  _updateNavTitle(title);
}

function _isOverlayOpen(){
  return ['#overlay','#sheet','#toolOverlay','#toolSheet','#menuOverlay','#drawer']
    .some(function(sel){ var el=$(sel); return el && el.classList.contains('show'); });
}
function _closeAnyOverlay(){
  var closed=false;
  ['#overlay','#sheet','#toolOverlay','#toolSheet','#menuOverlay','#drawer'].forEach(function(sel){
    var el=$(sel); if(el && el.classList.contains('show')){ el.classList.remove('show'); closed=true; }
  });
  return closed;
}
// 左缘右滑返回手势（与顶部 #pageBack 走同一条 _navBack 路径，逐级返回）
function initSwipeBack(){
  var sx=0, sy=0, tracking=false, startEl=null, W=window.innerWidth, back=false;
  var app = $('#appWrap') || document.body;
  app.addEventListener('touchstart', function(e){
    if(e.touches.length!==1){ tracking=false; return; }
    var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; back=false;
    startEl = document.elementFromPoint(sx, sy);
  }, {passive:true});
  app.addEventListener('touchmove', function(e){
    if(!tracking) return;
    var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(!back){
      // 仅在「左缘起手 + 明显横向右滑」时接管，其余（纵向滚动/普通横向）不干预
      if(sx <= W*0.35 && dx > 14 && dx > Math.abs(dy)*1.6){ back=true; }
      else if(Math.abs(dx) > 14){ tracking=false; return; }
    }
    // 关键：吃掉系统原生边缘返回手势，避免「一次滑动回退两级」(自定手势+系统返回 双触发)
    if(back && e.cancelable) e.preventDefault();
  }, {passive:false});
  app.addEventListener('touchend', function(e){
    if(!tracking) return; tracking=false;
    if(!back) return;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx, dy=t.clientY-sy;
    if(dx < 90 || dx < Math.abs(dy)*1.6) return;
    var el = startEl;                            // 画布/输入控件上不触发返回
    if(el && el.closest && (el.closest('canvas') || el.closest('input') || el.closest('textarea') || el.closest('select'))) return;
    _navBack();
  }, {passive:true});
}
function _navBack(){
  // 优先关闭当前打开的弹层/抽屉（选择图纸、管理、更多等），再走历史回退
  if (_closeAnyOverlay()) return;
  if (_navStack.length <= 1) return;  // 已在首页，不再回退
  // 只触发浏览器历史回退，栈同步与渲染由 popstate 统一处理
  history.back();
}

// popstate 统一处理器：根据当前 hash 同步导航栈并渲染
function _navSyncFromHash(){
  var currentHash = window.location.hash || '#home';
  var idx = -1;
  for (var i = _navStack.length - 1; i >= 0; i--){
    if ('#' + _navStack[i].key === currentHash){ idx = i; break; }
  }
  if (idx > 0){
    // 在栈中找到（含中间位置），裁剪到该层
    _navStack = _navStack.slice(0, idx + 1);
    var prev = _navStack[_navStack.length - 1];
    if (prev){
      $('#pageBack').style.display = 'inline';
      prev.render();
      _updateNavTitle(prev.title);
    }
  } else {
    // idx<=0（首页）或找不到（超出应用）：回到平台首页
    if (_navStack.length === 0) _navStack = [{key:'home', title:'生产管理', render:renderPlatformHome, back:null}];
    _navStack = [_navStack[0]];
    $('#pageBack').style.display = 'none';
    renderPlatformHome();
    _updateNavTitle('生产管理');
  }
}

function _updateNavTitle(title){
  $('#pageTitle').textContent = title;
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// Encode each path segment separately so '/' stays as path separator (security/route requirement)
function encodeVP(p){ return p.split('/').map(s=>encodeURIComponent(s)).join('/'); }

// ---- 页面加载入口 ----
async function loadModules(){
  try{
    const mods = await (await fetch('api/modules')).json();
    modulesCache = mods || [];
  }catch(e){ modulesCache = []; }
  // 监听系统返回手势/浏览器返回：统一由 _navSyncFromHash 处理
  window.addEventListener('popstate', function(e){
    _navSyncFromHash();
  });
  // 左缘右滑返回手势
  initSwipeBack();
  // 初始化首页
  _navStack = [];
  $('#pageBack').style.display = 'none';
  _navPush('home', '生产管理', renderPlatformHome, null);
  renderPlatformHome();
}

// ---- 进入模块 ----
function openModule(key){
  const mod = modulesCache.find(m=>m.key===key);
  const name = mod ? mod.name.replace('比对','').replace('对比','') : key;
  // 添加到导航栈，显示返回按钮
  _navPush(key, name, function(){
    $('#pageBack').style.display = 'inline';
    $('#pageBack').onclick = _navBack;
    if (MODULE_RENDERERS[key]) MODULE_RENDERERS[key]();
  }, null);
  // 显示返回按钮
  $('#pageBack').style.display = 'inline';
  $('#pageBack').onclick = _navBack;
  if (MODULE_RENDERERS[key]){
    MODULE_RENDERERS[key]();
  }
}

function unbindExtractList(r){
  if (!r) return [];
  if (Array.isArray(r)) return r;
  if (Array.isArray(r.list)) return r.list;

// 时间完整显示：YYYY-MM-DD HH:MM:SS（保留年份，避免跨年时歧义）
function unbindFormatTime(t){
  if (!t) return '-';
  const s = String(t).replace('T',' ').replace(/-/g,'/');
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(t);
  const Y = String(d.getFullYear()).padStart(4,'0');
  const M = String(d.getMonth()+1).padStart(2,'0');
  const D = String(d.getDate()).padStart(2,'0');
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const sec = String(d.getSeconds()).padStart(2,'0');
  return `${Y}-${M}-${D} ${h}:${m}:${sec}`;
}

function unbindRenderList(list){
  const box = $('#ubList');
  window.__ubSel = window.__ubSel || new Set();
  if (!list || !list.length){
    box.innerHTML = '<div class="unbind-empty">未找到匹配记录</div>';
    return;
  }
  box.innerHTML = list.map((it)=>{
    const id = String(it.id);
    const sel = window.__ubSel.has(id) ? ' sel' : '';
    const prod = it.productName ? `<div class="unbind-item-line ub-prod"><label>产品：</label>${esc(it.productName)}</div>` : '';
    return `
    <div class="unbind-item${sel}" data-id="${esc(id)}">
      <label class="ub-chk"><input type="checkbox" data-id="${esc(id)}" ${sel?'checked':''} /></label>
      <div class="ub-body">
        <div class="unbind-item-line"><label>上盖码：</label>${esc(it.coverCode || '-')}</div>
        <div class="unbind-item-line"><label>大板码：</label>${esc(it.bigCode || '-')}</div>
        <div class="unbind-item-line"><label>小板码：</label>${esc(it.smallCode || '-')}</div>
        <div class="unbind-item-line"><label>外箱码：</label>${esc(it.boxCode || '-')}</div>
        ${prod}
        <div class="unbind-item-time">${esc(unbindFormatTime(it.createTime))}</div>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.unbind-item').forEach((card)=>{
    const id = card.dataset.id;
    const chk = card.querySelector('input[type=checkbox]');
    const toggle = ()=>{
      if (window.__ubSel.has(id)) window.__ubSel.delete(id); else window.__ubSel.add(id);
      card.classList.toggle('sel');
      if (chk) chk.checked = window.__ubSel.has(id);
    };
    if (chk) chk.onchange = ()=>{
      if (chk.checked) window.__ubSel.add(id); else window.__ubSel.delete(id);
      card.classList.toggle('sel', chk.checked);
    };
    card.onclick = (e)=>{ if (e.target !== chk) toggle(); };
  });
}

// ---- 错误分类：根据 HTTP 状态码和响应体，区分不同故障原因 ----
function unbindClassifyError(status, body){
  const title = (body && (body.title || body.msg || body.message)) || '';
  const detail = (body && (body.detail || body.msg || body.message)) || '';
  if (status === 401)
    return { type:'auth', icon:'🔑', cls:'e-auth', title:'鉴权过期',
      detail:'目标系统登录已过期。平台正在尝试自动重新登录并刷新令牌，请稍候重试；若持续失败，请到「更多→解绑账号」确认账号配置无误。' };
  if (status === 502){
    if (title.includes('无法连接中转服务') || detail.includes('Node.js 中转服务'))
      return { type:'proxy', icon:'🔌', cls:'e-proxy', title:'中转服务未启动',
        detail:'本地中转服务(端口5001)未运行，请检查服务器是否正常开机或联系管理员。' };
    if (detail.includes('超时') || detail.includes('timeout'))
      return { type:'timeout', icon:'⏱️', cls:'e-timeout', title:'请求超时',
        detail:'目标系统响应超过 30 秒，可能网络拥堵或目标系统异常，请稍后重试。' };
    if (detail.includes('连接目标系统失败') || detail.includes('ECONNREFUSED') || detail.includes('ENOTFOUND'))
      return { type:'target', icon:'📡', cls:'e-target', title:'目标系统不可达',
        detail: detail || '无法连接到目标内网系统，请检查网络连通性。' };
    return { type:'target', icon:'📡', cls:'e-target', title:'目标系统不可达',
      detail: detail || title || '无法连接到目标内网系统，请检查网络。' };
  }
  if (status >= 500)
    return { type:'server', icon:'⚙️', cls:'e-server', title:'服务器内部错误',
      detail: detail || title || '后端处理异常，请稍后重试或联系管理员。' };
  return { type:'network', icon:'📡', cls:'e-network', title:'网络不通',
    detail:'无法连接到服务器，请检查 Wi-Fi 或网络连接是否正常。' };
}

// ---- 统一 fetch 封装：处理 HTTP 状态码 + 代理错误 ----
async function unbindFetch(url, bodyObj){
  let resp;
  try{
    resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(bodyObj)
    });
  }catch(e){
    throw { type:'network', icon:'📡', cls:'e-network', title:'网络不通',
      detail:'无法连接到服务器，请检查 Wi-Fi 或网络连接。(' + (e.message||e) + ')' };
  }
  const raw = await resp.text();
  let body = null;
  try{ body = JSON.parse(raw); }catch(_){ /* 非 JSON 响应 */ }
  if (!resp.ok) throw unbindClassifyError(resp.status, body);
  // resp.ok=true 但代理可能返回 {code:-1, msg:"连接目标系统失败：..."}
  if (body && body.code !== undefined && body.code !== 0 && body.code !== 200){
    const msg = body.msg || body.message || '未知错误';
    if (msg.includes('超时') || msg.includes('timeout'))
      throw { type:'timeout', icon:'⏱️', cls:'e-timeout', title:'请求超时', detail: msg };
    if (msg.includes('连接目标系统失败') || msg.includes('ECONNREFUSED') || msg.includes('ENOTFOUND'))
      throw { type:'target', icon:'📡', cls:'e-target', title:'目标系统不可达', detail: msg };
    throw { type:'server', icon:'⚠️', cls:'e-server', title:'操作失败', detail: msg };
  }
  return body;
}

      const h = String(d.getHours()).padStart(2,'0');

      const ts = `${M}-${D} ${h}:${m}`;
      const badge = e.result==='success'
        ? '<span class="usage-badge ok">成功</span>'
        : '<span class="usage-badge fail">失败</span>';
      let pdesc = '';
      if (e.action === 'search'){
        const p = e.params || {};
        const parts = [];
        if (p.coverCode) parts.push('上盖:' + p.coverCode);
        if (p.bigCode) parts.push('大板:' + p.bigCode);
        if (p.smallCode) parts.push('小板:' + p.smallCode);
        if (p.boxCode) parts.push('外箱:' + p.boxCode);
        pdesc = parts.join('，') || '(无参数)';
      } else {
        pdesc = '选中 ' + (e.count||0) + ' 条';
      }
      return `<div class="usage-item">
        <div class="usage-ic">${esc((actLabel[e.action]||'📋').slice(0,2))}</div>
        <div class="usage-body">
          <div class="usage-head">
            <span class="usage-act">${esc(actLabel[e.action]||e.action)}</span>
            ${badge}
            <span class="usage-time">${ts}</span>
          </div>
          <div class="usage-desc">${esc(pdesc)} → ${esc(e.detail||'')}</div>
        </div>
      </div>`;
    }).join('') +
    '</div>' +
    '<div class="usage-clear" id="ubUsageClear">🗑️ 清空使用记录</div>';
  const clr = container.querySelector('#ubUsageClear');
  if (clr) clr.onclick = async ()=>{
    if (confirm('确定清空全部使用记录吗？')){
      await unbindClearUsageLog();
      const fresh = await unbindGetUsageLog();
      unbindRenderUsageLog(container, fresh);
      toast('已清空使用记录');
    }
  };
}

// ---- 搜索 ----
async function unbindSearch(){
  const v = unbindGetValues();
  if (!v.coverCode && !v.bigCode && !v.smallCode && !v.boxCode){
    toast('请至少输入上盖码、大板码、小板码或外箱码其中一个');
    return;
  }
  window.__ubSel = new Set();
  unbindSetLoading('查询中…');
  try{
    const r = await unbindFetch('api/unbind/search', Object.assign({ page:1, limit:200 }, v));
    const list = unbindExtractList(r);
    if (!list.length){
      $('#ubList').innerHTML = '<div class="unbind-empty">未找到匹配记录</div>';
      toast('未找到匹配记录');
      unbindLogUsage('search', v, 'fail', '未找到匹配记录', 'no_data', 0);
    } else {
      unbindRenderList(list);
      toast(`查询到 ${list.length} 条记录，可勾选后解绑`);
      unbindLogUsage('search', v, 'success', `查询到 ${list.length} 条记录`, null, list.length);
    }
  }catch(err){
    if (err.cls){
      unbindShowError(err);
      toast(err.title);
      unbindLogUsage('search', v, 'fail', err.title, err.type, 0);
    } else {
      $('#ubList').innerHTML = '<div class="unbind-empty">查询失败：' + esc(err.message || err) + '</div>';
      toast('查询失败');
      unbindLogUsage('search', v, 'fail', err.message || '未知错误', 'unknown', 0);
    }
  }
}

// ---- 解绑（外箱 / 维修）----
async function unbindDo(type, label){
  const ids = Array.from(window.__ubSel || []);
  if (!ids.length){
    toast('请先搜索并勾选要解绑的记录');
    return;
  }
  if (!confirm(`确定对选中的 ${ids.length} 条记录执行「${label}」吗？`)) return;
  unbindSetLoading(label + '中…');
  const key = type === 'outer' ? 'outer' : 'repair';
  try{
    const r = await unbindFetch('api/unbind/' + key, { ids });
    toast(r.msg || r.message || (label + '成功'));
    window.__ubSel = new Set();
    $('#ubList').innerHTML = '<div class="unbind-empty">操作成功，列表已清空（可重新搜索）</div>';
    unbindLogUsage(type, { count: ids.length }, 'success', r.msg || r.message || (label + '成功'), null, ids.length);
  }catch(err){
    if (err.cls){
      unbindShowError(err);
      toast(err.title);
      unbindLogUsage(type, { count: ids.length }, 'fail', err.title, err.type, ids.length);
    } else {
      $('#ubList').innerHTML = '<div class="unbind-empty">' + label + '失败：' + esc(err.message || err) + '</div>';
      toast(label + '失败');
      unbindLogUsage(type, { count: ids.length }, 'fail', err.message || '未知错误', 'unknown', ids.length);
    }
  }
}
async function unbindOuter(){ await unbindDo('outer','外箱解绑'); }
async function unbindRepair(){ await unbindDo('repair','维修解绑'); }

let V2_PROFILES = [];
function v2BadgeOf(p){
  const bs = p.blocksStatus;
  if(bs==='extracting') return '<span class="tag" style="background:rgba(217,119,6,.10);color:#d97706">抽取中</span>';
  if(bs==='failed')     return '<span class="tag" style="background:rgba(220,38,38,.10);color:var(--bad)" title="'+esc(p.blocksError||'抽取失败')+'">抽取失败</span>';
  if(p.status!=='reviewed') return '<span class="tag" style="background:rgba(217,119,6,.10);color:#d97706">待复核</span>';
  if((p.blockCount||0)>0)   return '<span class="tag ok">就绪</span>';
  return '<span class="tag" style="background:rgba(107,114,128,.10);color:var(--sub)">未建档</span>';
}
async function loadDrawings(box, onSelect){
  box.innerHTML='<div class="meta-line"><span class="spinner"></span> 加载中…</div>';
  try{
    const list = await (await fetch('api/drawingsv2/profiles')).json();
    V2_PROFILES = Array.isArray(list) ? list : (list.profiles || []);
    renderList(box, V2_PROFILES, onSelect);
  }catch(e){ box.innerHTML='<div class="empty">加载失败：'+(e.message||e)+'</div>'; }
}
function renderList(box, list, onSelect){
  if(!list || !list.length){ box.innerHTML='<div class="empty">暂无图纸，请先在「管理 → 添加图纸」导入</div>'; return; }
  box.innerHTML = list.map(m=>`
    <div class="item" data-id="${m.id}">
      <div class="meta">
        <div class="fn">${esc(m.drawingKey)}</div>
        <div class="md">${v2BadgeOf(m)} <span style="opacity:.75">图块 ${m.blockCount??0}</span></div>
      </div>
      <span style="color:var(--sub)">选择 ›</span>
    </div>`).join('');
  box.querySelectorAll('.item[data-id]').forEach(el=>{
    el.onclick=()=> onSelect(parseInt(el.dataset.id,10));
  });
}
function bindSearch(inputEl, box, onSelect){
  let _t;
  inputEl.oninput = (e)=>{
    const q = e.target.value.trim().toLowerCase();
    clearTimeout(_t);
    _t = setTimeout(async ()=>{
      if(!V2_PROFILES.length){ await loadDrawings(box, onSelect); }
      if(!q){ renderList(box, V2_PROFILES, onSelect); return; }
      const hits = V2_PROFILES.filter(p => String(p.drawingKey||'').toLowerCase().includes(q));
      renderList(box, hits, onSelect);
    }, 150);
  };
}

// ---- 上传照片识别部位（含 45s 超时保护）----
async function onPartFile(e){
  const f0 = e.target.files[0]; if(!f0 || !curDrawing) return;
  const box = document.querySelector('.partResult');
  if(box) await submitV2(f0, box);
  e.target.value='';
}
const V2_STATE = {
  Matched:        { c:'#16a34a', bg:'rgba(22,163,74,.10)',  t:'一致' },
  LowConfidence:  { c:'#d97706', bg:'rgba(217,119,6,.10)',  t:'存疑' },
  Missing:        { c:'#dc2626', bg:'rgba(220,38,38,.10)',  t:'缺标' },
  Wrong:          { c:'#dc2626', bg:'rgba(220,38,38,.10)',  t:'错标' },
  Extra:          { c:'#7c3aed', bg:'rgba(124,58,237,.10)', t:'多标' },
  NotApplicable:  { c:'#6b7280', bg:'rgba(107,114,128,.08)',t:'不适用' },
  NotComparable:  { c:'#6b7280', bg:'rgba(107,114,128,.08)',t:'不可比' },
  ProcessingError:{ c:'#6b7280', bg:'rgba(107,114,128,.08)',t:'异常' }
};
// ★ 型号驱动：匹配按所选图纸(型号)的全部逻辑图块直接文本命中，不再使用拍摄部位(view)分类。
async function submitV2(file, box){
  box.innerHTML='<div class="meta-line"><span class="spinner"></span> v2 逻辑图块比对中…（约 15~40 秒，按所选图纸全部图块直接文本命中）</div>';
  const fd = new FormData();
  // 优先用文件名（v2 档案 key = PDF 文件名去扩展名），兼容 detail 返回 fileName / name
  fd.append('drawing', curDrawing.fileName || curDrawing.name || String(curDrawing.id));
  fd.append('file', file);
  // 不再下传 view：后端按逻辑图块自动选 Top 块，匹配不依赖部位（2026-09-28）。
  const ctrl = new AbortController();
  const to = setTimeout(()=> ctrl.abort(), 120000);   // v2 含 OCR，超时放宽到 120s
  try{
    const resp = await fetch('api/drawingsv2/compare/upload',{method:'POST',body:fd,signal:ctrl.signal});
    clearTimeout(to);
    const r = await resp.json();
    if(!resp.ok || r.error){ throw new Error(r.error || ('HTTP '+resp.status)); }
    renderV2Result(box, r, file);
  }catch(err){
    clearTimeout(to);
    if(err && err.name==='AbortError'){
      box.innerHTML='<div class="empty">v2 核对超时（&gt;120 秒）<div class="meta-line" style="margin-top:8px;">可关闭「v2 引擎」开关，按原流程继续</div></div>';
      return;
    }
    const raw = String((err && err.message) || err || '');
    box.innerHTML='<div class="empty">v2 核对失败：'+esc(raw)+'<div class="meta-line" style="margin-top:8px;">可关闭「v2 引擎」开关，按原流程继续</div></div>';
  }
}

function renderV2Result(box, r, file){
  const vs = r.verdicts || [];
  const hasBm = !!(r.blockMatch && r.blockMatch.enabled === true && r.blockMatch.top);
  // 部位(view) 选择已移除：匹配改为型号驱动的逻辑图块文本命中（按所选图纸全部图块自动选 Top）。
  // 若后端仍标记需选部位且无可用的逻辑图块结论，则提示重拍，不再提供「补选部位」交互。
  if(r.requiresViewSelection && !hasBm){
    // ★ 2026-09-28 方案C：图纸未建档（blocks=0 且自动提取未成功）→ 给「一键建档并比对」入口，而非误导重拍
    if(r.blockMatch && r.blockMatch.blocksMissing === true){
      box.innerHTML = `<div style="margin-top:10px;background:rgba(217,119,6,.10);border:1px solid #d97706;border-radius:12px;padding:12px;">
          <div style="font-weight:800;color:#d97706;font-size:13px;">该图纸尚未建立逻辑图块档案</div>
          <div class="meta-line" style="margin-top:6px;color:#92400e;">首次比对该图纸需先提取逻辑图块（含块级 OCR，约 1 分钟）。点击下方按钮建档后自动重新比对。</div>
          <button type="button" class="btn sm" id="btnV2BuildBlocks" style="margin-top:10px;background:#185FA5;color:#fff;border:none;">一键建档并比对</button>
        </div>`;
      const bb = box.querySelector('#btnV2BuildBlocks');
      if(bb) bb.onclick = async ()=>{
        bb.disabled = true; bb.textContent = '建档中（约1分钟）…';
        try{
          const resp = await fetch(`api/drawingsv2/profiles/${r.profileId}/blocks`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
          if(!resp.ok) throw new Error('HTTP '+resp.status);
        }catch(e){ box.innerHTML = '<div class="empty">建档失败：'+esc(String((e&&e.message)||e))+'</div>'; return; }
        submitV2(file, box);
      };
      return;
    }
    box.innerHTML = `<div style="margin-top:10px;background:rgba(217,119,6,.10);border:1px solid #d97706;border-radius:12px;padding:12px;">
        <div style="font-weight:800;color:#d97706;font-size:13px;">未能自动识别，未产出比对结论</div>
        <div class="meta-line" style="margin-top:6px;color:#92400e;">${esc(r.reason||'照片证据不足，无法与所选图纸的逻辑图块匹配。请拍清晰、正对部件的照片后重试。')}</div>
      </div>`;
    return;
  }
  const cnt = r.counts || {};
  const colorOf = s => (V2_STATE[s]||V2_STATE.ProcessingError).c;
  const bgOf    = s => (V2_STATE[s]||V2_STATE.ProcessingError).bg;
  const nameOf  = s => (V2_STATE[s]||V2_STATE.ProcessingError).t;

  let html = '';
  // 汇总条
  const order = ['Matched','LowConfidence','NotDetected','Missing','Wrong','Extra','NotComparable','NotApplicable','ProcessingError'];
  const chips = order.filter(k=>cnt[k]).map(k=>
    `<span style="display:inline-block;background:${bgOf(k)};border:1px solid ${colorOf(k)};color:${colorOf(k)};
      border-radius:20px;padding:4px 12px;font-size:12px;font-weight:800;margin:3px 4px 0 0;">${nameOf(k)} ${cnt[k]}</span>`).join('');
  html += `<div style="margin-top:10px;">
    <div class="meta-line" style="font-size:13px;font-weight:800;">v2 比对结论</div>
    <div style="margin-top:6px;">${chips||'<span style="color:var(--sub);font-size:12px;">无判定项</span>'}</div>
    <div class="meta-line" style="margin-top:6px;font-size:11px;opacity:.7;">
      档案 #${esc(String(r.profileId||'-'))} · ${esc(r.drawingKey||'')} · 记录 #${esc(String(r.recordId||'-'))} · ${esc(String(Math.round(r.verifyMs||0)))}ms
    </div>
    <div class="meta-line" style="margin-top:4px;font-size:11px;opacity:.7;">
      匹配方式：型号驱动 · 所选图纸全部逻辑图块文本命中（不依赖拍摄部位）
    </div></div>`;

  if(r.photoUsable === false){
    html += `<div style="margin-top:10px;background:rgba(220,38,38,.08);border:1px solid var(--bad);border-radius:12px;padding:12px;">
      <div style="font-weight:800;color:var(--bad);">📷 照片质量不可用</div>
      <div class="meta-line" style="color:var(--bad);">${esc((r.qualityReasons||[]).join('；')||'未通过质量门控')}</div></div>`;
  }

  // 照片标注区：canvas 画照片 + 检测框（绿=Matched/红=Missing/黄=LowConfidence）
  if(r.photo){
    html += `<div style="margin-top:10px;">
      <div class="meta-line" style="font-size:13px;font-weight:800;">📷 照片标注</div>
      <div class="meta-line" style="font-size:11px;opacity:.65;">${hasBm ? '实线框＝逻辑图块文本命中引擎四色结论（绿=一致 / 红=差异 / 黄=图标·QR缺失 / 灰=跳过）；虚线框＝图纸要求打标但照片未检出坐标（仅列表标注）' : '实线框＝照片上实际检出的位置；虚线框＝图纸要求打标、此处未检出（应在此处）'}</div>
      ${r.geometryApplied ? '<div class="meta-line" style="font-size:11px;opacity:.8;color:var(--warn,#b45309);">该照片已做透视矫正（'+esc(r.geometryMethod||'')+'），框基于矫正后视图，原图上位置可能有偏差，以文字结论为准</div>' : ''}
      <canvas id="v2PhotoCanvas" style="width:100%;border:1px solid var(--border);border-radius:8px;margin-top:6px;"></canvas>
    </div>`;
  }
  // 图纸回显区：canvas 画图纸截图 + mark 位置框
  if(r.drawingPdfPath){
    const previewUrl = `/api/drawingsv2/drawing-preview?pdf=${encodeURIComponent(r.drawingPdfPath)}&page=${r.drawingPageIndex||0}`;
    html += `<div style="margin-top:10px;">
      <div class="meta-line" style="font-size:13px;font-weight:800;">📐 图纸 mark 位置</div>
      <div class="meta-line" style="font-size:11px;opacity:.65;">框＝该 mark 在图纸页面上的位置（页面坐标，与照片视图无关）</div>
      <canvas id="v2DrawingCanvas" style="width:100%;border:1px solid var(--border);border-radius:8px;margin-top:6px;"></canvas>
    </div>`;
  }

  // 逻辑图块文本命中引擎结论卡片（新引擎）：移至图纸区域下方，仅标示已匹配项与有争议项
  html += bmSummaryHTML(r);

  // 逐项明细
  html += `<div style="margin-top:10px;">`;
  // 照片侧二维码编号 P1…Pn：按几何位置（先上后左，行容差 3% 图高）排序，
  // 保证同一张照片重复比对编号复现；图纸侧编号 #nnn 来自 markKey 后缀。二者成对即可精确指认对象。
  const qrSeq = v2PhotoQrSeqMap(vs);
  vs.forEach(v=>{
    const c = colorOf(v.state), bg = bgOf(v.state);
    const seq = v2MarkSeq(v.markKey);
    const pseq = qrSeq.get(v.markKey) || '';
    let qrTag = '';
    if((v.type||'') === 'Qr'){
      if(v.state==='Matched')            qrTag = '已检出二维码 · 位置符合';
      else if(v.state==='LowConfidence') qrTag = '检出存疑 · 需按编号人工确认';
      else if(v.state==='NotComparable') qrTag = '码检测降级 · 不可比对';
      else if(v.state==='Missing')       qrTag = '未见对应二维码';
      else if(v.state==='NotDetected')   qrTag = '照片不可读 · 未检出';
      else if(v.state==='Extra')         qrTag = '照片多出的码 · 图纸未声明';
      // Extra 目前不带 photoBbox（后端未返回坐标）→ 无法编号定位，必须明说，
      // 否则现场会以为「知道有个多余的码但标不出来」是前端故障。
      if(v.state==='Extra' && !pseq) qrTag += '（位置未定位：无坐标）';
    }
    html += `<div style="border:1px solid ${c};background:${bg};border-radius:12px;padding:10px 12px;margin-top:8px;">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <span style="background:${c};color:#fff;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:800;">${nameOf(v.state)}</span>
        ${seq?`<span style="font-family:var(--font-mono,monospace);font-weight:800;font-size:11.5px;color:${V2_TYPE_COLOR[v.type]||V2_TYPE_COLOR.Text};">${esc(seq)}</span>`:''}
        <b style="font-size:12.5px;">${esc(v.text || (v.type==='Qr'?'二维码':(v.type==='Icon'?'图标':'文本'))) }</b>
        <span style="font-size:11px;opacity:.7;">${esc(v.type)}</span>
        ${pseq?`<span style="font-size:11px;opacity:.9;border:1px solid currentColor;border-radius:5px;padding:0 5px;">照片 ${esc(pseq)}</span>`:''}
        ${qrTag?`<span style="font-size:11px;opacity:.85;">${esc(qrTag)}</span>`:''}
        ${(v.offset!=null)?`<span style="font-size:11px;opacity:.7;">偏移 ${Number(v.offset).toFixed(3)}</span>`:''}
      </div>
      <div style="margin-top:5px;font-size:11.5px;opacity:.85;line-height:1.5;">${esc(v.evidence||'')}</div>
      ${v.observedData?`<div style="margin-top:3px;font-size:11px;opacity:.6;">解码提示（仅供参考，不参与判定）：${esc(String(v.observedData).slice(0,40))}</div>`:''}
      ${(function(){
        const hv = v.human || null;
        const need = !['Matched','NotApplicable'].includes(v.state);
        if(!need && !hv) return '';
        const B = [['HumanPresent','✓ 实物有标','#16a34a'],['HumanMissing','✗ 实物缺标','#dc2626'],['HumanWrongPart','↷ 拍错部位','#d97706']];
        let s = `<div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;" data-v2h="${esc(v.markKey||'')}">`;
        B.forEach(b=>{
          const on = hv && hv.state===b[0];
          s += `<button type="button" class="btn sm" data-v2hs="${b[0]}" style="font-size:11px;padding:3px 8px;border:1px solid ${b[2]};color:${on?'#fff':b[2]};background:${on?b[2]:'transparent'};">${b[1]}</button>`;
        });
        s += `</div>`;
        if(hv) s += `<div style="margin-top:5px;font-size:11px;opacity:.85;">👤 人工确认：${esc(V2_HUMAN[hv.state]||hv.state)}${hv.by?' · '+esc(hv.by):''}${hv.at?' · '+esc(hv.at):''}</div>`;
        return s;
      })()}
    </div>`;
  });
  html += `</div>`;

  if((r.skippedNoBbox||[]).length){
    html += `<div class="meta-line" style="margin-top:8px;font-size:11px;opacity:.6;">有 ${r.skippedNoBbox.length} 项无坐标未参与定点核对</div>`;
  }
  // G1 人工复核 + G2 会话汇总入口
  html += `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
    ${r.sessionId ? `<button class="btn sm" id="btnV2Session" style="border:1px solid var(--bd);">🗂 本会话汇总（${esc(String(r.sessionId).slice(0,10))}…）</button>` : ''}
  </div>`;
  html += `<div class="meta-line" style="margin-top:10px;font-size:11px;opacity:.6;">
    v2 只做「应打标对象的识别与位置比对」，不判合格与否；存疑/缺标请人工复核。</div>`;
  box.innerHTML = html;

  // ② 判定级人工确认：逐条「实物有标 / 实物缺标 / 拍错部位」
  box.querySelectorAll('[data-v2h]').forEach(wrap=>{
    const mk = wrap.getAttribute('data-v2h');
    wrap.querySelectorAll('[data-v2hs]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!r.recordId){ toast('该结果未落库，无法记录人工确认'); return; }
        btn.disabled = true;
        try{
          const res = await fetch(`/api/drawingsv2/records/${r.recordId}/verdicts`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({items:[{markKey:mk, humanState:btn.getAttribute('data-v2hs')}]})
          });
          const j = await res.json().catch(()=>({}));
          if(!res.ok || j.ok === false){ toast('人工确认保存失败：'+(j.error||res.status)); btn.disabled=false; return; }
          const v = (r.verdicts||[]).find(x=>x.markKey===mk);
          if(v) v.human = { state: btn.getAttribute('data-v2hs') };
          toast('已记录人工确认');
          renderV2Result(box, r, file);
        }catch(e){ toast('人工确认失败：'+String(e.message||e)); btn.disabled=false; }
      };
    });
  });

  const sesBtn = box.querySelector('#btnV2Session');
  if(sesBtn) sesBtn.onclick = ()=> openV2Session(r.sessionId);

  // 异步绘制照片标注 canvas
  if(r.photo){
    drawPhotoAnnotations(r, vs, colorOf, qrSeq);
  }
  // 异步绘制图纸回显 canvas
  if(r.drawingPdfPath){
    drawDrawingAnnotations(r, vs, colorOf);
  }

  const miss = cnt.Missing||0, low = cnt.LowConfidence||0, nd = cnt.NotDetected||0;
  if(miss) toast(`v2：${miss} 项缺标，请复核`);
  else if(low||nd) toast(`v2：${low} 项存疑 / ${nd} 项未检出，请复核`);
  else if(vs.length) toast('v2：全部一致');
  else toast('v2：未产出任何判定，不能视为一致');
}

// G1 人工复核：弹出图纸对象清单，勾选=参与比对、取消=禁用误提取项，确认后置 reviewed
// 对象编号：markKey 的 "#nnn" 后缀。入库即固定、永久稳定，
// 多 QR / 多图标场景下现场靠这个编号精确指认「图纸上第几号对象」。
function v2MarkSeq(markKey){
  const s = String(markKey||'');
  // extra#xxxx 是「照片多出的码」的临时序号，不是图纸对象编号。
  // 若照常显示成 #nnn，现场会把它误认成图纸上登记的对象，必须排除。
  if(/^extra#/i.test(s)) return '';
  const i = s.lastIndexOf('#');
  return i >= 0 ? '#' + s.slice(i+1) : '';
}
const V2_TYPE_COLOR = { Text:'#185FA5', Qr:'#7F77DD', Icon:'#BA7517', Group:'#888780' };

// 照片侧二维码编号 P1…Pn：按几何位置排序（先上后左，行容差 3% 图高），
// 保证同一张照片重复比对时编号稳定复现 —— 否则人工指认无法沉淀。
// 与图纸侧 #nnn 成对显示，即可在多 QR 场景精确指认对象。
function v2PhotoQrSeqMap(vs){
  const items = [];
  (vs||[]).forEach(v=>{
    if((v.type||'') !== 'Qr') return;
    const b = v.photoBbox;
    if(!b || b.length < 4) return;
    items.push({ key: v.markKey, cx: b[0] + b[2]/2, cy: b[1] + b[3]/2 });
  });
  items.sort((a,b)=> Math.abs(a.cy - b.cy) > 0.03 ? (a.cy - b.cy) : (a.cx - b.cx));
  const m = new Map();
  items.forEach((it,i)=> m.set(it.key, 'P' + (i+1)));
  return m;
}

// 图纸页 + 对象位置框 + #nnn 编号。取消勾选的画虚线半透明（不参与比对）。
function paintReviewDrawing(canvas, img, marks, page, hiIdx, isActive){
  const W = img.naturalWidth, H = img.naturalHeight;
  if(!W || !H) return;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const lw = Math.max(2, W/500), fs = Math.max(13, W/70);
  const dash = [Math.max(5, W/130), Math.max(4, W/190)];
  marks.forEach((m,i)=>{
    if(Number(m.pageIndex||0) !== Number(page)) return;
    const bb = (m.normBbox && m.normBbox.length >= 4) ? m.normBbox : null;
    if(!bb) return;
    const on = isActive(m.markKey);
    const [x,y,w,h] = bb;
    const px = x*W, py = y*H, pw = w*W, ph = h*H;
    const col = (hiIdx === i) ? '#dc2626' : (V2_TYPE_COLOR[m.type] || V2_TYPE_COLOR.Text);
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.4;
    ctx.setLineDash(on ? [] : dash);
    ctx.strokeStyle = col;
    ctx.lineWidth = (hiIdx === i) ? lw*3 : lw;
    ctx.strokeRect(px, py, pw, ph);
    ctx.restore();

    const seq = v2MarkSeq(m.markKey);
    const nm = m.text ? String(m.text).slice(0,10)
             : (m.type==='Qr' ? '二维码' : (m.type==='Icon' ? '图标' : (m.type||'对象')));
    const label = seq ? (seq + ' ' + nm) : nm;
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.55;
    ctx.font = `${fs}px sans-serif`;
    const tw = ctx.measureText(label).width;
    const ly = py > fs*1.7 ? (py - fs*1.4) : (py + ph);
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillRect(px, ly, tw + fs*0.5, fs*1.4);
    ctx.fillStyle = col;
    ctx.fillText(label, px + fs*0.22, ly + fs*1.08);
    ctx.restore();
  });
}


// G2 会话合并：展示一次多部位检验的跨照片聚合结论
async function openV2Session(sessionId){
  if(!sessionId) return;
  const resp = await fetch('api/drawingsv2/sessions/'+encodeURIComponent(sessionId));
  if(!resp.ok){ toast('会话不存在或为空'); return; }
  const d = await resp.json();
  const agg = (d.aggregated||[]).map(a=>`
    <div style="display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--bd);font-size:12.5px;">
      <span style="min-width:54px;font-weight:800;color:${(V2_STATE[a.verdict]||V2_STATE.ProcessingError).c};">${(V2_STATE[a.verdict]||V2_STATE.ProcessingError).t}</span>
      <b>${esc(a.text||a.markKey)}</b>
      <span style="opacity:.6;font-size:11px;">${esc((a.states||[]).join('/'))}</span>
    </div>`).join('');
  const overlay = buildOverlay(`<div style="max-width:540px;width:94%;">
    <h3>🗂 会话汇总（${esc(String(sessionId).slice(0,12))}…）</h3>
    <div class="meta-line" style="font-size:11px;opacity:.7;">共 ${esc(String(d.recordCount||0))} 张照片 · 跨部位合并结论（任一部位缺标→缺标；全一致→一致；含存疑/混合→需复核）</div>
    <div style="max-height:52vh;overflow:auto;margin-top:8px;border:1px solid var(--bd);border-radius:8px;padding:4px 8px;">${agg||'<div class="empty">无数据</div>'}</div>
    <div style="margin-top:10px;text-align:right;"><button class="btn sm" id="ovClose">关闭</button></div></div>`);
  overlay.querySelector('#ovClose').onclick = ()=> overlay.remove();
}

// 简易全屏弹层（浅色商务风，跟随主题变量）
function buildOverlay(innerHtml){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
  const card = document.createElement('div');
  card.style.cssText = 'background:var(--bg,#fff);border:1px solid var(--bd,#ddd);border-radius:14px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:86vh;overflow:auto;';
  card.innerHTML = innerHtml;
  ov.appendChild(card);
  ov.onclick = (e)=>{ if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
  return ov;
}

// 逻辑图块文本命中引擎的四色色板（与 BlockTextMatcher 四色对齐：green/red/yellow/gray）
function bmColorOf(c){
  return ({ green:'#16a34a', red:'#dc2626', yellow:'#d97706', gray:'#888780' })[c] || '#888780';
}
function bmLabel(e){
  if(e.kind === 'qr')   return '二维码';
  if(e.kind === 'icon') return '图标';
  if(e.kind === 'photo_extra_code') return '码/图标(照片多出)';
  if(e.kind === 'photo_extra')      return (e.text ? String(e.text).slice(0,14) : '照片多出');
  return e.text ? String(e.text).slice(0,14) : (e.kind || '文本');
}

// 在照片上画检测框：
//  - 若 compare 返回了 blockMatch（新·逻辑图块文本命中引擎），优先用它的四色结论画框
//    （绿=一致 / 红=差异 / 黄=图标·QR缺失 / 灰=跳过）；L2＝照片侧直接检出框（画框），L3＝无照片坐标（不画框，仅列表标注，见 bmSummaryHTML）。
//  - 否则回退到旧 verdicts 引擎画法（零回归）。
function drawPhotoAnnotations(r, vs, colorOf, qrSeq){
  const canvas = document.getElementById('v2PhotoCanvas');
  if(!canvas) return;
  const img = new Image();
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const lw = Math.max(2, canvas.width / 400);
    const fs = Math.max(14, canvas.width/60);

    const bm = r.blockMatch;
    const useBm = bm && bm.enabled === true && bm.top;
    if(useBm){
      // —— 新引擎：逻辑图块文本命中四色框 ——
      const items = [];
      (bm.top.elements || []).forEach(e => items.push(e));
      (bm.extra||[]).forEach(e => items.push(e));
      items.forEach(e => {
        const pn = e.photoNorm;
        if(!pn || pn.length < 4) return;                 // L3：照片侧无坐标 → 不画框（仅列表标注）
        // 2026-09-29：QR/图标在图纸与照片两侧均保留，但无需在照片上画额外标示框（仅结论卡片说明）
        if(e.kind === 'qr' || e.kind === 'icon') return;
        const [x, y, w, h] = pn;
        const px = x * canvas.width, py = y * canvas.height;
        const pw = w * canvas.width, ph = h * canvas.height;
        const col = bmColorOf(e.color);
        ctx.strokeStyle = col; ctx.lineWidth = lw;
        ctx.strokeRect(px, py, pw, ph);
        // 2026-09-29 用户要求：照片标示框附带的小字去掉，只画框
      });
      return;   // 新引擎优先；旧 verdicts 画框不叠加，避免两套框互相干扰
    }

    // —— 旧引擎回退（blockMatch 未启用 / 无 Top）——
    vs.forEach(v => {
      const actual = (v.photoBbox && v.photoBbox.length >= 4) ? v.photoBbox : null;
      const expected = (v.expectedBbox && v.expectedBbox.length >= 4) ? v.expectedBbox : null;
      // 虚线：没有实际检出位置时才画「应在此处」，避免与实际框重叠干扰
      if(!actual && expected){
        const [ex, ey, ew, eh] = expected;
        ctx.save();
        ctx.setLineDash([Math.max(6, canvas.width/90), Math.max(4, canvas.width/140)]);
        ctx.strokeStyle = colorOf(v.state);
        ctx.lineWidth = lw;
        ctx.strokeRect(ex*canvas.width, ey*canvas.height, ew*canvas.width, eh*canvas.height);
        ctx.setLineDash([]);
        ctx.fillStyle = colorOf(v.state);
        ctx.font = `${fs}px sans-serif`;
        ctx.fillText((v.text ? String(v.text).slice(0,12) : v.type) + '（应在此处）',
                     ex*canvas.width + 4, ey*canvas.height + 20);
        ctx.restore();
        return;
      }
      if(!actual) return;
      const [x, y, w, h] = actual;
      const px = x * canvas.width, py = y * canvas.height;
      const pw = w * canvas.width, ph = h * canvas.height;
      ctx.strokeStyle = colorOf(v.state);
      ctx.lineWidth = lw;
      ctx.strokeRect(px, py, pw, ph);
      // 标签
      ctx.fillStyle = colorOf(v.state);
      ctx.font = `${fs}px sans-serif`;
      // 照片画布：多二维码场景用稳定的 P 编号区分对象，便于与图纸 #nnn 配对指认
      const pseq = qrSeq ? (qrSeq.get(v.markKey) || '') : '';
      const label = ((v.type||'')==='Qr')
        ? ((pseq || '二维码') + (v.text ? ' '+String(v.text).slice(0,10) : ''))
        : (v.text ? String(v.text).slice(0, 12) : v.type);
      ctx.fillText(label, px + 4, py + 20);
    });
  };
  img.src = r.photoUrl || r.photo;
}

// 在图纸截图上画 mark 位置框
function drawDrawingAnnotations(r, vs, colorOf){
  const canvas = document.getElementById('v2DrawingCanvas');
  if(!canvas) return;
  const bm = r.blockMatch;
  const hasBm = !!(bm && bm.enabled === true && bm.top);
  const img = new Image();
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    // 画 mark 位置框（旧引擎 verdicts）
    vs.forEach(v => {
      if(!v.drawingBbox || v.drawingBbox.length < 4) return;
      const [x, y, w, h] = v.drawingBbox;
      const px = x * canvas.width, py = y * canvas.height;
      const pw = w * canvas.width, ph = h * canvas.height;
      ctx.strokeStyle = colorOf(v.state);
      ctx.lineWidth = Math.max(2, canvas.width / 400);
      ctx.strokeRect(px, py, pw, ph);
      // 标签
      ctx.fillStyle = colorOf(v.state);
      ctx.font = `${Math.max(14, canvas.width/60)}px sans-serif`;
      // 图纸画布：标出对象永久编号 #nnn（来自 markKey 后缀），现场按编号指认
      const dseq = v2MarkSeq(v.markKey);
      const label = (dseq ? dseq+' ' : '') + (v.text ? String(v.text).slice(0, 12) : v.type);
      ctx.fillText(label, px + 4, py + 20);
    });
    // ★ 型号驱动（参考 V1 图纸侧返回逻辑，用户选定方案：仅高亮命中块整体区域）
    // 命中块图纸页级框 top.blockNorm=[x,y,w,h]；逐元素四色明细已在结论卡片 bmSummaryHTML。
    if(hasBm && bm.top.blockNorm && bm.top.blockNorm.length >= 4){
      const top = bm.top;
      const [x, y, w, h] = top.blockNorm;
      const px = x * canvas.width, py = y * canvas.height;
      const pw = w * canvas.width, ph = h * canvas.height;
      const lw2 = Math.max(3, canvas.width / 220);
      ctx.strokeStyle = '#185FA5'; ctx.lineWidth = lw2;
      ctx.strokeRect(px, py, pw, ph);
      ctx.fillStyle = '#185FA5'; ctx.font = `${Math.max(14, canvas.width/55)}px sans-serif`;
      ctx.fillText('命中块：' + (top.name || ('#' + top.blockIndex)), px + 4, py + 20);
    }
  };
  const pdf = encodeURIComponent(r.drawingPdfPath);
  // 型号驱动：图纸预览优先定位到命中块所在页（top.pageIndex），否则沿用档案默认页
  const page = (hasBm && typeof bm.top.pageIndex === 'number') ? bm.top.pageIndex : (r.drawingPageIndex || 0);
  img.src = `/api/drawingsv2/drawing-preview?pdf=${pdf}&page=${page}`;
}

// 逻辑图块文本命中引擎结论卡片（新引擎；与旧 verdicts 列表并列展示便于对照；L3 项在此以列表呈现）
function bmSummaryHTML(r){
  const bm = r.blockMatch;
  if(!bm) return '';
  const chip = c => `<span style="display:inline-block;background:${bmColorOf(c)};color:#fff;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:800;">${c==='green'?'一致':c==='red'?'差异':c==='yellow'?'图标/QR缺':'跳过'}</span>`;
  if(bm.enabled !== true){
    return `<div style="margin-top:10px;background:rgba(136,135,128,.08);border:1px solid #888780;border-radius:12px;padding:10px 12px;">
      <div class="meta-line" style="font-size:12px;font-weight:800;color:#555;">🧩 逻辑图块匹配（新引擎）</div>
      <div class="meta-line" style="font-size:11.5px;opacity:.8;margin-top:4px;">未启用：${esc(bm.reason || '无结论')}</div></div>`;
  }
  const top = bm.top;
  // 仅标示「已匹配项(green)」与「有争议项(red/yellow)」；灰(d类跳过)不展示，候选块/照片多出等冗余项亦不展示
  const eRows = (top && top.elements ? top.elements : [])
    .filter(e => e.color === 'green' || e.color === 'red' || e.color === 'yellow')
    .map(e=>{
      const txt = (e.kind==='qr'?'二维码':e.kind==='icon'?'图标':(e.text || e.kind));
      return `<div style="border:1px solid ${bmColorOf(e.color)};border-radius:10px;padding:6px 9px;margin-top:6px;font-size:11.5px;">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${chip(e.color)} <b>${esc(String(txt))}</b>
          <span style="opacity:.6;">${esc(e.kind||'')}</span>
          ${e.mappingLevel==='L3'?'<span style="opacity:.6;font-size:10.5px;">· 照片无定位坐标（仅列表）</span>':''}</div>
        <div style="opacity:.8;margin-top:3px;line-height:1.45;">${esc(e.reason||'')}</div></div>`;
    }).join('');
  return `<div style="margin-top:10px;background:rgba(24,95,165,.06);border:1px solid #185FA5;border-radius:12px;padding:10px 12px;">
    <div class="meta-line" style="font-size:12px;font-weight:800;color:#185FA5;">🧩 逻辑图块匹配（新引擎）</div>
    <div class="meta-line" style="font-size:11px;opacity:.8;margin-top:4px;">命中块：${esc(top?(top.name||('#'+top.blockIndex)):'-')} · 得分 ${top?top.score:0} · 一致${top?top.nGreen:0}/差异${top?top.nRed:0}/图标QR缺${top?top.nYellow:0}${bm.degraded?' · ⚠️ '+esc(bm.degradeReason||'照片召回不足'):''}</div>
    ${eRows || '<div class="meta-line" style="font-size:11px;opacity:.7;margin-top:4px;">命中块内无逐元素结论（元素均为跳过项，无需标示）</div>'}
  </div>`;
}

// 2026-09-29 阶段三：上传/同步切 V2（/profiles/import 单请求多文件、/profiles/sync）。
// V2 import 端点 foreach Form.Files（字段名 file），一次请求可带多张；响应 {count, results:[{profileId,fileName,drawingKey,error}]}。
async function onAddFiles(e){
  const files = e.target.files;
  if(!files || !files.length){ return; }
  const msg = $('#addMsg');
  const upInput = $('#addFiles');
  upInput.disabled = true;
  msg.innerHTML = `<span class="spinner"></span> 上传解析中（共 ${files.length} 张，建档约 3~8 秒/张）…`;
  const fd = new FormData();
  for(const f of files){ fd.append('file', f); }
  try{
    const r = await (await fetch('api/drawingsv2/profiles/import',{method:'POST',body:fd})).json();
    const results = r.results||[];
    const ok = results.filter(x=>!x.error);
    const bad = results.filter(x=>x.error);
    const lines = results.map(x=> x.error
      ? `❌ ${esc(x.fileName||'?')}：${esc(x.error)}`
      : `✅ ${esc(x.fileName||'?')} 已建档（后台抽取逻辑图块中，可在「图纸档案」看进度）`);
    msg.innerHTML = `✅ 成功 <b>${ok.length}</b> 张` + (bad.length?` · ⚠️ 失败 ${bad.length} 张`:'') +
      `<div class="meta-line" style="margin-top:6px;opacity:.85;">${lines.join('<br>')}</div>` +
      (ok.length?`<div class="meta-line" style="margin-top:6px;color:#d97706;">新图纸为「待复核」状态：抽取完成后到「管理 → 图纸档案」复核通过，方可拍照比对。</div>`:'');
    toast(`已导入 ${ok.length} 张图纸`);
  }catch(err){
    msg.textContent = '❌ 上传失败：'+(err.message||err);
  }finally{
    upInput.disabled = false;
  }
  e.target.value='';
}

// 复核口径与后端门禁一致：GET /profiles/{id}/review 取全量 marks → POST items 全 confirmed → status=reviewed 放行比对。
function renderProfilesPanel(body){
  body.innerHTML = `
    <div class="menu-back" id="pfBack">‹ 返回</div>
    <div class="meta-line" style="font-weight:600;color:var(--txt);margin-bottom:10px;">图纸档案（V2）</div>
