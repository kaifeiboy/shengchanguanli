    <div class="card" id="pfList" style="padding:12px;"><div class="meta-line"><span class="spinner"></span> 加载中…</div></div>`;
  $('#pfBack').onclick = ()=>{ body.classList.add('hide'); body.innerHTML=''; $('#toolList').style.display=''; $('#toolTitle').textContent='管理'; };
  const load = async ()=>{
    const box = $('#pfList'); if(!box) return;
    box.innerHTML='<div class="meta-line"><span class="spinner"></span> 加载中…</div>';
    try{
      const list = await (await fetch('api/drawingsv2/profiles')).json();
      const arr = Array.isArray(list)?list:(list.profiles||[]);
      V2_PROFILES = arr;
      if(!arr.length){ box.innerHTML='<div class="empty">暂无档案，请先「添加图纸」</div>'; return; }
      const draftN = arr.filter(p=>p.status!=='reviewed').length;
      box.innerHTML = `<div class="meta-line" style="margin-bottom:8px;">共 <b>${arr.length}</b> 个档案 · 待复核 <b style="color:#d97706">${draftN}</b></div>` +
        arr.map(p=>`
        <div class="item" data-id="${p.id}">
          <div class="meta">
            <div class="fn">${esc(p.drawingKey)}</div>
            <div class="md">${v2BadgeOf(p)} <span style="opacity:.75">图块 ${p.blockCount??0} · marks ${p.markCount??0}</span></div>
          </div>
          ${p.status==='reviewed' ? '<span style="color:var(--sub)">✓</span>' : `<button class="btn sm" data-rev="${p.id}" style="background:#185FA5;color:#fff;border:none;">复核通过</button>`}
        </div>`).join('');
      box.querySelectorAll('button[data-rev]').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = parseInt(btn.dataset.rev,10);
          btn.disabled=true; btn.textContent='复核中…';
          try{
            const pg = await (await fetch('api/drawingsv2/profiles/'+id+'/review')).json();
            const marks = pg.marks||[];
            const items = marks.map(m=>({markKey:(m.markKey||m.key||m.id),isActive:true,confirmed:true})).filter(i=>i.markKey);
            if(!items.length){ btn.textContent='无 marks，复核失败'; toast('该档案无 marks，无法复核'); return; }
            const r = await (await fetch('api/drawingsv2/profiles/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewedBy:'h5-manage',note:'H5 一键复核',items})})).json();
            if(r && r.ok){ toast('已复核通过'); load(); }
            else { btn.disabled=false; btn.textContent='复核失败'; toast('复核失败：'+((r&&r.error)||'未知错误')); }
          }catch(err){ btn.disabled=false; btn.textContent='复核失败'; toast('复核失败：'+(err.message||err)); }
        };
      });
    }catch(err){ box.innerHTML='<div class="empty">加载失败：'+(err.message||err)+'</div>'; }
  };
  load();
}

let _scanStream=null, _scanTimer=null, _scanTarget=null, _scanDet=null, _scanCanvas=null, _scanMsgEl=null;
function _makeBarcodeDetector(){

// 图像预处理：灰度
function _makeGrayCanvas(srcCanvas){
  const w=srcCanvas.width, h=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const srcCtx=srcCanvas.getContext('2d');
  const dstCtx=dst.getContext('2d');
  const imgData=srcCtx.getImageData(0,0,w,h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    d[i]=d[i+1]=d[i+2]=g;
  }
  dstCtx.putImageData(imgData,0,0);
  return dst;
}
// 图像预处理：二值化
function _makeBinaryCanvas(srcCanvas, threshold){
  const w=srcCanvas.width, h=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const srcCtx=srcCanvas.getContext('2d');
  const dstCtx=dst.getContext('2d');
  const imgData=srcCtx.getImageData(0,0,w,h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    const v=g<threshold?0:255;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  dstCtx.putImageData(imgData,0,0);
  return dst;
}
// 图像预处理：等比放大
function _scaleCanvas(srcCanvas, factor){
  const w=Math.round(srcCanvas.width*factor), h=Math.round(srcCanvas.height*factor);
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const ctx=dst.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(srcCanvas,0,0,w,h);
  return dst;
}
// 图像预处理：旋转/翻转。deg=0/90/180/270；flip='h'|'v'|'hv'（水平/垂直/180度）。
// jsQR / zxing-js 默认不试 4 方向（zxing-cpp 服务端支持），倒置/侧向 QR 必须靠旋转变体解出。
// canvas 旋转代价：~1ms（1280x720 实测），相比 3500ms 的 ZXing 单变体超时可忽略。
function _flipCanvas(srcCanvas, mode){
  const w=srcCanvas.width, h=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const ctx=dst.getContext('2d');
  if(mode==='h'){ ctx.translate(w,0); ctx.scale(-1,1); ctx.drawImage(srcCanvas,0,0); }
  else if(mode==='v'){ ctx.translate(0,h); ctx.scale(1,-1); ctx.drawImage(srcCanvas,0,0); }
  else { ctx.translate(w,h); ctx.scale(-1,-1); ctx.drawImage(srcCanvas,0,0); }
  return dst;
}
// 图像预处理：CLAHE 局部直方图均衡（修复 PCB 浅灰/反光/低对比度二维码无法识别）
// 等价于 cv2.createCLAHE(clipLimit, tileGridSize=(N,N))
// 性能：1280x720 桌面 V8 约 57ms，3x 降采样到 426x240 后约 7ms
// 为控制单帧成本，大于 960 长边的图像先降采样再 CLAHE（QR 解码对 426+ 像素足够鲁棒）
function _claheCanvas(srcCanvas, clipLimit, tileGrid){
  clipLimit = (typeof clipLimit==='number' && clipLimit>0) ? clipLimit : 2.0;
  const tg = (typeof tileGrid==='number' && tileGrid>=2) ? tileGrid : 8;
  let w=srcCanvas.width, h=srcCanvas.height;
  let workCanvas=srcCanvas;
  // 大图先降采样，控制单帧成本（CLAHE 是 O(npix)，1280x720 桌面约 57ms，移动端约 150-250ms）
  const LONG_EDGE_MAX=960;
  const longEdge=Math.max(w,h);
  if(longEdge>LONG_EDGE_MAX){
    const sc=LONG_EDGE_MAX/longEdge;
    workCanvas=_scaleCanvas(srcCanvas, sc); // _scaleCanvas 在同文件上面定义
    w=workCanvas.width; h=workCanvas.height;
  }
  const srcCtx=workCanvas.getContext('2d');
  const sd=srcCtx.getImageData(0,0,w,h).data;
  const npix = w*h;
  // 灰度图（定点化避免浮点运算）
  const gray=new Uint8Array(npix);
  for(let i=0,j=0;j<npix;i+=4,j++){
    // ITU-R BT.601 luma: 0.299R+0.587G+0.114B ≈ (77R+150G+29B)/256
    gray[j] = (sd[i]*77 + sd[i+1]*150 + sd[i+2]*29) >> 8;
  }
  const tx=Math.max(2, Math.floor(tg));
  const ty=Math.max(2, Math.floor(tg));
  const NUM=256;
  const luts=new Uint8Array(tx*ty*NUM);
  // tile 边界预计算
  const yBounds=new Int32Array(ty+1);
  const xBounds=new Int32Array(tx+1);
  for(let i=0;i<=ty;i++) yBounds[i] = Math.floor(i*h/ty);
  for(let i=0;i<=tx;i++) xBounds[i] = Math.floor(i*w/tx);
  // 每 tile 直方图 + CDF
  for(let tyi=0; tyi<ty; tyi++){
    const y0=yBounds[tyi], y1=yBounds[tyi+1];
    for(let txi=0; txi<tx; txi++){
      const x0=xBounds[txi], x1=xBounds[txi+1];
      const tnpix=(x1-x0)*(y1-y0);
      const hist=new Uint32Array(NUM);
      for(let y=y0;y<y1;y++){
        const off=y*w;
        for(let x=x0;x<x1;x++) hist[gray[off+x]]++;
      }
      let clipVal=(clipLimit*tnpix/NUM)|0;
      if(clipVal<1) clipVal=1;
      let excess=0;
      for(let i=0;i<NUM;i++){
        const h=hist[i];
        if(h>clipVal){ excess += (h-clipVal); hist[i]=clipVal; }
      }
      const perBin=(excess/NUM)|0;
      const rem=excess - perBin*NUM;
      for(let i=0;i<NUM;i++) hist[i] += perBin + (i<rem?1:0);
      let cum=0;
      const lutBase=(tyi*tx+txi)*NUM;
      for(let i=0;i<NUM;i++){
        cum += hist[i];
        luts[lutBase+i] = ((cum*255)/tnpix)|0;
      }
    }
  }
  // 输出（像素级双线性插值）
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const dstCtx=dst.getContext('2d');
  const dstImg=dstCtx.createImageData(w,h);
  const dd=dstImg.data;
  const tileWp=w/tx, tileHp=h/ty;
  for(let y=0;y<h;y++){
    const yw=y*w;
    const gy=((y+0.5)/tileHp) - 0.5;
    let tyi=gy|0;
    if(tyi<0) tyi=0;
    else if(tyi>=ty-1) tyi=ty-2;
    if(tyi<0) tyi=0; if(tyi>ty-2) tyi=ty-2;
    let fy=gy-tyi; if(fy<0) fy=0; else if(fy>1) fy=1;
    const baseY=tyi*tx, baseY1=(tyi+1)*tx;
    for(let x=0;x<w;x++){
      const gx=((x+0.5)/tileWp) - 0.5;
      let txi=gx|0;
      if(txi<0) txi=0;
      else if(txi>=tx-1) txi=tx-2;
      if(txi<0) txi=0; if(txi>tx-2) txi=tx-2;
      let fx=gx-txi; if(fx<0) fx=0; else if(fx>1) fx=1;
      const v=gray[yw+x];
      const a=luts[(baseY +txi)*NUM+v]*(1-fx)*(1-fy)
             + luts[(baseY +txi+1)*NUM+v]*fx*(1-fy)
             + luts[(baseY1+txi)*NUM+v]*(1-fx)*fy
             + luts[(baseY1+txi+1)*NUM+v]*fx*fy;
      const idx=(yw+x)*4;
      dd[idx]=a; dd[idx+1]=a; dd[idx+2]=a; dd[idx+3]=255;
    }
  }
  dstCtx.putImageData(dstImg,0,0);
  return dst;
}
// 图像预处理：自动对比度拉伸（把灰度范围拉满 0-255，提升浅灰色二维码对比度）
function _autoContrastCanvas(srcCanvas){
  const w=srcCanvas.width, h=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const srcCtx=srcCanvas.getContext('2d');
  const dstCtx=dst.getContext('2d');
  const imgData=srcCtx.getImageData(0,0,w,h);
  const d=imgData.data;
  let min=255, max=0;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    if(g<min) min=g; if(g>max) max=g;
  }
  if(max<=min) max=min+1;
  const range=max-min;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    const v=Math.round((g-min)*255/range);
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  dstCtx.putImageData(imgData,0,0);
  return dst;
}
// 图像预处理：中心裁剪（ratio: 0-1，用户常把目标放画面中央）
function _centerCropCanvas(srcCanvas, ratio){
  const w=Math.max(1, Math.round(srcCanvas.width*ratio));
  const h=Math.max(1, Math.round(srcCanvas.height*ratio));
  const x=Math.round((srcCanvas.width-w)/2);
  const y=Math.round((srcCanvas.height-h)/2);
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  dst.getContext('2d').drawImage(srcCanvas, x, y, w, h, 0, 0, w, h);
  return dst;
}
// 图像预处理：自适应阈值（局部均值，适合光照不均）
function _adaptiveThresholdCanvas(srcCanvas, blockSize, C){
  const w=srcCanvas.width, h=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=w; dst.height=h;
  const srcCtx=srcCanvas.getContext('2d');
  const dstCtx=dst.getContext('2d');
  const imgData=srcCtx.getImageData(0,0,w,h);
  const d=imgData.data;
  // 先算灰度
  const gray=new Uint8Array(w*h);
  for(let i=0, j=0; i<d.length; i+=4, j++){
    gray[j]=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
  }
  // 积分图
  const integral=new Int32Array((w+1)*(h+1));
  for(let y=0;y<h;y++){
    let rowSum=0;
    for(let x=0;x<w;x++){
      rowSum+=gray[y*w+x];
      integral[(y+1)*(w+1)+(x+1)]=integral[y*(w+1)+(x+1)]+rowSum;
    }
  }
  const half=Math.floor(blockSize/2);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const x1=Math.max(0,x-half), y1=Math.max(0,y-half);
      const x2=Math.min(w-1,x+half), y2=Math.min(h-1,y+half);
      const count=(x2-x1+1)*(y2-y1+1);
      const sum=integral[(y2+1)*(w+1)+(x2+1)]-integral[(y1)*(w+1)+(x2+1)]-integral[(y2+1)*(w+1)+(x1)]+integral[(y1)*(w+1)+(x1)];
      const mean=sum/count;
      const idx=(y*w+x)*4;
      const v=gray[y*w+x] < (mean-C) ? 0 : 255;
      d[idx]=d[idx+1]=d[idx+2]=v; d[idx+3]=255;
    }
  }
  dstCtx.putImageData(imgData,0,0);
  return dst;
}
// 用 jsQR 解码单个 canvas
function _tryJsQR(canvas){
  try{
    if(typeof jsQR !== 'function') return null;
    const ctx=canvas.getContext('2d');
    const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const r=jsQR(imgData.data, imgData.width, imgData.height, {inversionAttempts:'attemptBoth'});
    return r && r.data ? {rawValue:r.data, format:'qr_code'} : null;
  }catch(e){ return null; }
}
// 用 jsQR 解码多个预处理变体，专门提升 PCB 标签/浅灰二维码/小码识别率
// 精简版（v2，2026-07-30）：从 30+ 变体砍到 12 变体，覆盖原图/180°/CLAHE/阈值，加 180° 旋转变体解决倒置QR
// 单次扫描总耗时从 ~9s 降到 ~2s（1280 长边 + 移动端 V8）
function _tryJsQRVariants(canvas){
  if(typeof jsQR !== 'function') return null;
  try{
    const gray=_makeGrayCanvas(canvas);
    const auto=_autoContrastCanvas(gray);
    // 180° 旋转变体：覆盖倒置QR（zxing-js 浏览器版不自动试 4 方向）
    const gray180=_flipCanvas(gray, 'hv');
    const auto180=_flipCanvas(auto, 'hv');
    const variants=[gray, gray180, auto, auto180];
    // PCB 浅灰模块需要高阈值（150-220）才能二值化为黑模块
    for(const th of [170, 190, 210, 230]){
      variants.push(_makeBinaryCanvas(gray, th));
      variants.push(_makeBinaryCanvas(gray180, th));
    }
    // CLAHE 局部直方图均衡：修复 PCB 浅灰/反光/低对比度二维码
    // （实测 Python 端 zxing-cpp 在 clahe3 变体上对反光白底 100% 命中）
    const cl3=_claheCanvas(gray, 3.0);
    variants.push(cl3);
    variants.push(_flipCanvas(cl3, 'hv'));
    // ── 小码专用变体（极小低对比度灰底码：中心裁剪→高倍放大→二值化）──
    // 用户常把设备标签放画面中央但 QR 仅占画面 5-8%，需要裁剪+放大让模块清晰
    for(const ratio of [0.5, 0.6]){
      const crop=_centerCropCanvas(canvas, ratio);
      const cg=_makeGrayCanvas(crop);
      const up3=_scaleCanvas(cg, 3);
      variants.push(_makeBinaryCanvas(up3, 170));
      variants.push(_makeBinaryCanvas(up3, 190));
    }
  }catch(e){}
  for(const v of variants){
    const r=_tryJsQR(v);
    if(r) return r;
  }
  return null;
}
// 用 ZXing 解码二维码（比 jsQR 更鲁棒，擅长 PCB 标签/低质量/反光场景）
function _tryZxing(canvas){
  return new Promise((resolve)=>{
    try{
      if(typeof ZXing === 'undefined' || !ZXing.BrowserQRCodeReader){ resolve(null); return; }
      const reader=new ZXing.BrowserQRCodeReader();
      const url=canvas.toDataURL('image/png');
      const t=setTimeout(()=>resolve(null), 3500);
      reader.decodeFromImageUrl(url)
        .then(result=>{
          clearTimeout(t);
          if(result && result.text!=null) resolve({rawValue:String(result.text), format:'qr_code'});
          else resolve(null);
        })
        .catch(e=>{ clearTimeout(t); resolve(null); });
    }catch(e){ resolve(null); }
  });
}
// ZXing 多预处理变体：把灰度/二值/CLAHE/180°翻转后的图像喂给 ZXing
// 精简版（v2，2026-07-30）：从 30+ 变体砍到 ~12 变体。
// 砍掉 3x 放大（服务端 4x 已覆盖）+ 9 个自适应阈值组合（保留 2 个）+ 1 个额外 CLAHE。
// 关键加 180° 旋转变体：zxing-js 浏览器版默认不试 4 方向，倒置QR 必须靠翻转换支持。
// 单次扫描总耗时从 ~12s 降到 ~2.5s（移动端 V8）
async function _tryZxingVariants(canvas){
  if(typeof ZXing === 'undefined' || !ZXing.BrowserQRCodeReader) return null;
  try{
    const gray=_makeGrayCanvas(canvas);
    const auto=_autoContrastCanvas(gray);
    // 180° 旋转变体
    const gray180=_flipCanvas(gray, 'hv');
    const auto180=_flipCanvas(auto, 'hv');
    const variants=[canvas, gray, gray180, auto, auto180];
    // 阈值变体（高阈值解决 PCB 浅灰模块）
    for(const th of [170, 190, 210]){
      variants.push(_makeBinaryCanvas(gray, th));
      variants.push(_makeBinaryCanvas(gray180, th));
    }
    // CLAHE 局部直方图均衡：反光/低对比度白底二维码
    const cl3=_claheCanvas(gray, 3.0);
    variants.push(_claheCanvas(gray, 2.0));
    variants.push(cl3);
    variants.push(_flipCanvas(cl3, 'hv'));
    // 自适应阈值（保留 2 个组合，覆盖浅灰模块最坏情况）
    variants.push(_adaptiveThresholdCanvas(gray, 51, 5));
    variants.push(_adaptiveThresholdCanvas(gray, 31, 10));
    // ── 小码专用变体（中心裁剪→高倍放大→CLAHE/原始）──
    for(const ratio of [0.5, 0.6]){
      const crop=_centerCropCanvas(canvas, ratio);
      const cg=_makeGrayCanvas(crop);
      variants.push(_scaleCanvas(cg, 3));       // 3x 放大原始灰度
      variants.push(_claheCanvas(_scaleCanvas(cg, 3), 3.0)); // 3x + CLAHE
    }
    for(const v of variants){
      const r=await _tryZxing(v);
      if(r) return r;
    }
  }catch(e){}
  return null;
}
// 用 Quagga2 解码一维条码兜底（纯 JS：Code128/39、EAN、UPC、ITF、Codabar 等）
function _tryQuagga(dataUrl, patchSize){
  return new Promise((resolve)=>{
    try{
      if(typeof Quagga === 'undefined' || !Quagga.decodeSingle){ resolve(null); return; }
      const readers=[
        'code_128_reader','code_39_reader','code_39_vin_reader',
        'ean_reader','ean_8_reader','ean_13_reader','ean_13_extended_reader',
        'upc_reader','upc_e_reader','itf_reader','codabar_reader','i2of5_reader'
      ];
      // patchSize: small/medium/large/x-large，不同大小条码用不同尺寸尝试
      const cfg={
        src:dataUrl,
        numOfWorkers:0,
        inputStream:{ size:1280 },
        locator:{ patchSize:(patchSize||'medium'), halfSample:false },
        decoder:{ readers:readers, multiple:false }
      };
      Quagga.decodeSingle(cfg, function(result){
        if(result && result.codeResult && result.codeResult.code){
          resolve({rawValue:String(result.codeResult.code), format:(result.codeResult.format||'1d')});
        }else{ resolve(null); }
      });
    }catch(e){ resolve(null); }
  });
}
// 尝试 BarcodeDetector.detect()，失败自动重试；彻底不可用也不抛错，交由上层继续 fallback
async function _detectWithFallback(det, canvas, retries=2){
  let lastErr='';
  for(let i=0;i<=retries;i++){
    try{
      const codes=await det.detect(canvas);
      if(codes && codes.length) return codes;
      await new Promise(r=>setTimeout(r,120));
    }catch(e){
      lastErr=(e && (e.message||String(e))) || '';
      if(i<retries) await new Promise(r=>setTimeout(r,300));
    }
  }
  // BarcodeDetector 失败后用 jsQR 兜底二维码；若连 jsQR 也没有也不抛错
  const qr=_tryJsQR(canvas);
  if(qr) return [qr];
  return [];
}
// 统一解码入口：二维码/一维码都试，不抛错
// 服务端强解码兜底：把图像（压缩为 jpeg，最长边 1280）发给 /api/unbind/qr-decode，
// 后端用本机 Python(zxing-cpp) 解出反光/低对比度白底二维码。失败静默返回 null（不阻塞主流程）。
async function _tryServerQr(canvas, dataUrl){
  try{
    let payload=dataUrl;
    // 转 jpeg 并限制最长边 1280，减小上行体积与解码耗时
    try{
      if(canvas && canvas.width){
        const MAX=1280;
        const w=canvas.width, h=canvas.height;
        const sc=Math.min(1, MAX/Math.max(w||1,h||1));
        const c=document.createElement('canvas');
        if(sc<1){ c.width=Math.round(w*sc); c.height=Math.round(h*sc); }
        else { c.width=w; c.height=h; }
        c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);
        payload=c.toDataURL('image/jpeg',0.9);
      }
    }catch(_){ /* 失败则退回原 dataUrl */ }

    // 首次尝试：完整图像
    const r1=await _serverQrPost(payload);
    if(r1) return r1;

    // 二次尝试：中心裁剪 50%（小码放大后 zxing-cpp 更容易锁定 finder pattern）
    // 仅当 canvas 可用且首次失败时触发（避免正常码的双重开销）
    if(canvas && canvas.width && canvas.height){
      try{
        const crop=_centerCropCanvas(canvas, 0.5);
        const cropPayload=crop.toDataURL('image/jpeg',0.9);
        const r2=await _serverQrPost(cropPayload);
        if(r2) return r2;
      }catch(_){ /* 裁剪失败则跳过 */ }
    }
    return null;
  }catch(e){ return null; }
}

// 服务端 POST 请求封装（复用超时/错误处理）
async function _serverQrPost(payload){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(), 5000);
  try{
    const resp=await fetch('/api/unbind/qr-decode',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:payload}),
      signal:ctrl.signal
    });
    clearTimeout(timer);
    if(!resp.ok) return null;
    const j=await resp.json();
    if(j && j.text) return { rawValue: String(j.text).trim() };
    return null;
  }catch(e){
    clearTimeout(timer);
    return null;
  }
}
// 竞速原语：并发执行多个解码 promise，返回【第一个解出非空结果】的，全部为空才返回 null。
// 对标微信「检测先行 + 服务端强解码」并行思路：端侧 BarcodeDetector 与服务端 zxing-cpp 同时跑，
// 谁先解出用谁（典型 ~200ms），避免串行等待拖慢体验。
function _raceFirstSuccess(promises){
  return new Promise((resolve)=>{
    let pending=promises.length, settled=false;
    for(const p of promises){
      Promise.resolve(p).then(r=>{
        if(r && !settled){ settled=true; resolve(r); }
        else { pending--; if(pending===0 && !settled) resolve(null); }
      }).catch(()=>{ pending--; if(pending===0 && !settled) resolve(null); });
    }
    if(pending===0 && !settled) resolve(null);
  });
}
async function _decodeImage(canvas, dataUrl){
  const _t0=performance.now();
  // 总时间预算 4s：超出后停止再试（剩余环节不再跑），让用户尽快看到失败提示而非一直卡住
  const _budget=4000;
  const _over=()=>(performance.now()-_t0)>_budget;
  if(_setScanMsg) _setScanMsg('正在识别…');
  // 微信式「检测先行 + 服务端强解码」并行竞速（典型 ~200ms）：
  // ① 端侧 BarcodeDetector（最快，清晰码秒解）② 服务端 zxing-cpp（200ms，4 方向旋转不变，反光/小码鲁棒）
  // 两者谁先解出用谁；均失败才退化为浏览器暴力枚举（离线/服务端不可达兜底）
  const fast=_raceFirstSuccess([
    _detectWithFallback(_makeBarcodeDetector(), canvas, 1)
      .then(codes=>(codes && codes.length)?codes[0]:null).catch(()=>null),
    _tryServerQr(canvas, dataUrl).catch(()=>null)
  ]);
  const fastR=await fast;
  if(fastR) return fastR;
  if(_over()) return null;
  // —— 以下为离线/服务端不可达兜底：浏览器暴力枚举（含 180° 旋转变体）——
  // 2) jsQR 多预处理变体（含 180° 旋转变体覆盖倒置QR）
  const jsqrCode=_tryJsQRVariants(canvas);
  if(jsqrCode) return jsqrCode;
  if(_over()) return null;
  // 3) ZXing：鲁棒二维码解码，擅长 PCB 标签/反光/小码（含 180° 旋转变体）
  const zxingCode=await _tryZxingVariants(canvas);
  if(zxingCode) return zxingCode;
  if(_over()) return null;
  // 4) 一维条码 Quagga2：仅在上述全失败时跑（1D 条码概率低，单 patchSize 即可）
  if(_setScanMsg) _setScanMsg('服务端无法识别，尝试一维条码…');
  const q=await _tryQuagga(dataUrl, 'medium');
  if(q) return q;
  return null;
}
function _setScanMsg(t){ if(_scanMsgEl) _scanMsgEl.textContent=t; }
// 内网 http 降级：调用系统相机拍照 → BarcodeDetector 静态解码（不受安全上下文限制）
function scanByPhoto(targetId){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=async ()=>{
    const f=inp.files && inp.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(!f) return;
    // 至少有一个纯 JS 解码库（jsQR/Quagga/ZXing）可用即可；都没加载再提示
    const hasZxing=typeof ZXing !== 'undefined' && !!ZXing.BrowserQRCodeReader;
    if(typeof jsQR !== 'function' && (typeof Quagga === 'undefined' || !Quagga.decodeSingle) && !hasZxing){
      toast('扫码解码库未加载，请彻底清除浏览器缓存后重试');
      return;
    }
    const url=URL.createObjectURL(f);
    const img=new Image();
    img.onload=async ()=>{
      try{
        const c=document.createElement('canvas');
        // 手机照片常 2000px+，先缩到最长边 1280 提升识别率与速度
        const MAX=1280;
        let w=img.naturalWidth, h=img.naturalHeight;
        const sc=Math.min(1, MAX/Math.max(w||1,h||1));
        w=Math.round((w||1)*sc); h=Math.round((h||1)*sc);
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=c.toDataURL();
        URL.revokeObjectURL(url);
        const code=await _decodeImage(c, dataUrl);
        if(code){ _fillScanResult(code,targetId); }
        else{ toast('未识别到二维码/条码，请对准清晰后重拍，或手动输入'); }
      }catch(e){ toast('解码失败：'+((e&&e.message)?e.message:e)); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); toast('图片读取失败，请重试'); };
    img.src=url;
  };
  inp.click();
}
function _fillScanResult(code,targetId){
  const val=(code && (code.rawValue||'')).trim();
  const el=document.getElementById(targetId || _scanTarget);
  if(el) el.value=val;
  toast('已识别：'+(val.length>24?val.slice(0,24)+'…':val));
  closeScan();
}
async function scanCapture(){
  if(!_scanStream || !_scanDet){ toast('相机未就绪，请稍后再试'); return; }
  const v=document.getElementById('scanVideo');
  if(!v || !v.videoWidth){ toast('画面未就绪，请稍等'); return; }
  const capBtn=document.getElementById('scanCapture');
  if(capBtn) capBtn.disabled=true;
  _setScanMsg('正在识别…');
  try{
    if(!_scanCanvas){ _scanCanvas=document.createElement('canvas'); }
    // 拍照后先缩到最长边 1280 再解码——CLAHE/jsQR/ZXing 全是 O(npix)，
    // 2000x2000 拍照图会让变体循环跑 9-15s，1280 是识别率与速度的最佳平衡点
    const MAX=1280;
    let w=v.videoWidth, h=v.videoHeight;
    const sc=Math.min(1, MAX/Math.max(w||1,h||1));
    w=Math.round((w||1)*sc); h=Math.round((h||1)*sc);
    _scanCanvas.width=w; _scanCanvas.height=h;
    _scanCanvas.getContext('2d').drawImage(v,0,0,w,h);
    const dataUrl=_scanCanvas.toDataURL('image/jpeg', 0.9);
    const code=await _decodeImage(_scanCanvas, dataUrl);
    if(code){ _fillScanResult(code); }
    else{ _setScanMsg('未识别到，请对准后再次点击「拍照识别」'); }
  }catch(e){ _setScanMsg('识别失败：'+((e&&e.message)?e.message:e)); }
  finally{ if(capBtn) capBtn.disabled=false; }
}
async function openScan(targetId){
  // 非安全上下文（内网 http 访问）→ 走系统相机拍照解码，内网也能扫码
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return scanByPhoto(targetId);
  }
  const det=_makeBarcodeDetector();
  if(!det){ toast('当前浏览器不支持扫码，请手动输入，或改用安卓端 Chrome/Edge'); return; }
  _scanDet=det; _scanTarget=targetId;
  const modal=document.getElementById('scanModal');
  _scanMsgEl=document.getElementById('scanMsg');
  const capBtn=document.getElementById('scanCapture');
  _setScanMsg('将二维码/条码放入框内…');
  if(capBtn){ capBtn.disabled=false; capBtn.onclick=scanCapture; }
  modal.classList.add('show');
  try{
    // 安卓：尽量要后置摄像头、高分辨率、连续对焦
    _scanStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920}, height:{ideal:1080},
        focusMode:{ideal:'continuous'}
      },
      audio:false
    });
    const v=document.getElementById('scanVideo');
    v.srcObject=_scanStream; v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    await v.play();
    _setScanMsg('识别中… 若未自动识别，请点击「拍照识别」');
    if(!_scanCanvas) _scanCanvas=document.createElement('canvas');
    let last=0, busy=false;
    const tick=async ()=>{
      if(!_scanStream) return;
      const now=performance.now();
      if(!busy && now-last>=250 && v.videoWidth && v.readyState>=2){
        busy=true; last=now;
        try{
          _scanCanvas.width=v.videoWidth; _scanCanvas.height=v.videoHeight;
          _scanCanvas.getContext('2d').drawImage(v,0,0,_scanCanvas.width,_scanCanvas.height);
          const codes=await _detectWithFallback(_scanDet,_scanCanvas,1);
          if(codes && codes.length){ _fillScanResult(codes[0]); return; }
        }catch(e){ /* 单帧失败继续 */ }
        finally{ busy=false; }
      }
      _scanTimer=setTimeout(tick,80);
    };
    tick();
  }catch(e){
    _setScanMsg('无法打开相机：'+((e&&e.message)?e.message:e));
  }
}
function closeScan(){
  if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer=null; }
  if(_scanStream){ _scanStream.getTracks().forEach(t=>t.stop()); _scanStream=null; }
  const modal=document.getElementById('scanModal');
  if(modal) modal.classList.remove('show');
  _setScanMsg('将二维码/条码放入框内…');
}

          <div class="meta-line"><b>${esc(row.date)}</b> · ${esc(row.line)} · <b>${esc(row.model)}</b></div>
          <div class="meta-line">发生工程：${esc(row.stage||'-')} ｜ 数量：${esc(row.qty||'-')} ｜ 处理：${esc(row.handle||'-')}</div>
          <div class="meta-line" style="color:var(--txt);">${esc(row.reason||'')}</div>
        </div>
        <div class="dh-row-img">
          ${row.hasImage
            ? `<span class="dh-img-wrap dh-loading"><img class="dh-thumb" loading="lazy" decoding="async" data-row="${row.row}" data-i="0" src="${dhImgUrl(row.row, 0, true)}" alt="不良图"/></span>`
            : '<span class="tag part">无图</span>'}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;

  // 图片：加载中 spinner → 成功显示 / 失败占位可重试；点击放大
  box.querySelectorAll('.dh-img-wrap').forEach(wrap => {
    const im = wrap.querySelector('img.dh-thumb');
    if (!im) return;
    im.addEventListener('load', () => wrap.classList.remove('dh-loading'));
    im.addEventListener('error', () => {
      wrap.classList.remove('dh-loading');
      wrap.classList.add('dh-error');
      if (!wrap.querySelector('.dh-img-err-txt')){
        const t = document.createElement('span');
        t.className = 'dh-img-err-txt';
        t.textContent = '⚠️ 图片加载失败，点此重试';
        wrap.appendChild(t);
        t.onclick = (e) => { e.stopPropagation(); dhImgRetry(wrap, im); };
        // 自动重试一次（带缓存破坏符），覆盖瞬时网络抖动
        if (!wrap.dataset.retried){
          wrap.dataset.retried = '1';
          setTimeout(() => { if (wrap.classList.contains('dh-error')) dhImgRetry(wrap, im); }, 1500);
        }
      }
    });
    im.onclick = () => dhViewImage(im.dataset.row, im.dataset.i);
  });
  // 复选框：更新选中集合 + 行高亮 + 工具栏计数
  box.querySelectorAll('.dh-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      const k = cb.dataset.key;
      if (cb.checked) dhSelected.add(k); else dhSelected.delete(k);
      const row = cb.closest('.dh-row');
      if (row) row.classList.toggle('dh-row-sel', cb.checked);
      dhUpdateBatchBar(box, allKeys);
    });
  });
  // 工具栏事件
  const allCb = $('#dhSelAll', box); if (allCb) allCb.onchange = (e) => dhSetAllChecked(box, allKeys, !!e.target.checked);
  const invBtn = $('#dhSelInv', box); if (invBtn) invBtn.onclick = () => dhSetAllChecked(box, allKeys, null);
  const clrBtn = $('#dhSelClr', box); if (clrBtn) clrBtn.onclick = () => dhSetAllChecked(box, allKeys, false);
  const batchBtn = $('#dhBatchDel', box); if (batchBtn) batchBtn.onclick = dhBatchDelete;
  // 新一次查询：清掉与新结果不重合的旧选择（保持新结果里仍勾选的）
  for (const k of Array.from(dhSelected)) if (!allKeys.includes(k)) dhSelected.delete(k);
  // 恢复勾选状态 + 高亮
  box.querySelectorAll('.dh-cb').forEach(cb => {
    if (dhSelected.has(cb.dataset.key)) { cb.checked = true; cb.closest('.dh-row').classList.add('dh-row-sel'); }
  });
  dhUpdateBatchBar(box, allKeys);
}

function dhSetAllChecked(box, allKeys, checked){
  box.querySelectorAll('.dh-cb').forEach(cb => {
    if (allKeys.includes(cb.dataset.key)){
      const want = (checked === null) ? !cb.checked : checked;
      if (cb.checked !== want){ cb.checked = want; cb.dispatchEvent(new Event('change')); }
    }
  });
}

function dhUpdateBatchBar(box, allKeys){
  const inResult = Array.from(dhSelected).filter(k => allKeys.includes(k));
  $('#dhSelCount', box).textContent = '已选 ' + inResult.length + ' 条';
  const total = allKeys.length;
  $('#dhBatchDel', box).disabled = inResult.length === 0;
  const allCb = $('#dhSelAll', box);
  if (allCb) allCb.checked = total > 0 && inResult.length === total;
  else if (allCb) allCb.checked = false;
}

async function dhBatchDelete(){
  // 单 Sheet 汇总表：key = 数据行索引
  const items = Array.from(dhSelected).map(k => ({ row: parseInt(k, 10) }));
  if (items.length === 0) return;
  const preview = items.slice(0, 3).map(i => '第' + (i.row + 1) + '行').join('\n');
  const more = items.length > 3 ? '\n... 等共 ' + items.length + ' 条' : '';
  if (!confirm('确定批量删除这 ' + items.length + ' 条不良记录？\n\n' + preview + more + '\n\n每条删除前会自动备份 (.bak)。')) return;
  let ok = 0, bad = 0, firstErr = '';
  toast('开始批量删除 ' + items.length + ' 条…');
  for (const it of items){
    try{
      const r = await (await fetch(dhAPI('delete'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(it)
      })).json();
      if (r.ok) ok++; else { bad++; if (!firstErr) firstErr = r.error || '未知'; }
    }catch(e){ bad++; if (!firstErr) firstErr = e.message || String(e); }
  }
  dhSelected.clear();
  toast('批量删除完成：成功 ' + ok + (bad ? ' / 失败 ' + bad + (firstErr ? '（' + firstErr + '）' : '') : ''));
  if (dhLastQuery) dhDoQuery();
}

function dhImgRetry(wrap, im){
  wrap.classList.add('dh-loading');
  wrap.classList.remove('dh-error');
  const t = wrap.querySelector('.dh-img-err-txt');
  if (t) t.remove();
  // 追加时间戳绕过浏览器缓存，强制重新加载
  im.src = dhImgUrl(im.dataset.row, im.dataset.i, true) + '&t=' + Date.now();
}

function dhViewImage(row, i){
  const src = dhImgUrl(row, i, false);
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,15,25,.88);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;';
  const spin = document.createElement('div');
  spin.className = 'dh-img-spin';
  const img = document.createElement('img');
  img.style.cssText = 'max-width:94vw;max-height:84vh;border-radius:10px;object-fit:contain;background:#fff;';
  img.alt = '不良图';
  // 调试信息：让用户可现场核对"图片对应行"（如仍有错配可一键定位）
  const hint = document.createElement('div');
  hint.style.cssText = 'color:#cbd5e1;font-size:11.5px;text-align:center;line-height:1.6;';
  hint.innerHTML = '服务端 row=<b style="color:#fff;">' + row + '</b> → xlsx 1-based row=<b style="color:#fff;">' + (row + 2) + '</b><br/>点击任意处关闭';
  ov.appendChild(spin);
  ov.appendChild(img);
  ov.appendChild(hint);
  let loaded = false;
  img.onload = () => { loaded = true; spin.remove(); };
  img.onerror = () => {
    spin.remove();
    img.remove();
    const err = document.createElement('div');
    err.style.cssText = 'color:#fca5a5;font-size:14px;font-weight:600;padding:14px 18px;border:1px dashed rgba(252,165,165,.5);border-radius:10px;background:rgba(30,20,20,.5);cursor:pointer;';
    err.textContent = '⚠️ 图片加载失败，点此重试';
    err.onclick = () => { err.remove(); ov.appendChild(spin); const n = new Image(); n.src = src + '&t=' + Date.now(); n.onload = () => { loaded = true; spin.remove(); ov.insertBefore(n, hint); n.style.cssText = img.style.cssText; }; n.onerror = () => { spin.remove(); err.textContent = '加载失败，请检查网络后重试'; ov.appendChild(err); }; };
    ov.appendChild(err);
  };
  img.src = src;
  ov.onclick = () => ov.remove();
  document.body.appendChild(ov);
}

// 单条录入下拉选项（线别/发生工程/处理方式）：服务端 meta（数据去重 + 默认项）∪ localStorage（手动新增持久化）
let dhLineOpts = [], dhStageOpts = [], dhHandleOpts = [];
let dhAddFiles = [];   // 单条录入待上传图片：{file, url, anno:[], baked, bakedUrl}（含标注烘焙结果）
function dhLocalGet(k){ try{ return JSON.parse(localStorage.getItem('dh_' + k) || '[]'); }catch(e){ return []; } }
function dhLocalAdd(k, v){
  if(!v) return;
  const arr = dhLocalGet(k);
  if(arr.indexOf(v) < 0){ arr.push(v); try{ localStorage.setItem('dh_' + k, JSON.stringify(arr)); }catch(e){} }
}
function dhMergeOpts(base, local){
  const seen = {}; (base||[]).concat(local||[]).forEach(o => { if(o) seen[o] = 1; });
  return Object.keys(seen);
}
function dhLoadDropOpts(){
  if (dhLineOpts.length && dhStageOpts.length && dhHandleOpts.length) return Promise.resolve();
  return fetch(dhAPI('meta')).then(r=>r.json()).then(m => {
    dhLineOpts = dhMergeOpts(m.lines||[], dhLocalGet('lines'));
    dhStageOpts = dhMergeOpts(m.stages||[], dhLocalGet('stages'));
    dhHandleOpts = dhMergeOpts(m.handles||[], dhLocalGet('handles'));
  }).catch(()=>{});
}
// 通用自定义下拉：点击/输入展开、过滤、支持"使用新值"、点外部关闭（手机端兼容，替代 datalist）
function dhInitDropdown(cfg){
  const input = $(cfg.input), list = $(cfg.list), btn = $(cfg.btn);
  const close = () => { list.style.display = 'none'; };
  const render = () => {
    const q = (input.value || '').trim();
    const opts = (cfg.options() || []).slice();
    let items;
    if (q){
      const ql = q.toLowerCase();
      const match = opts.filter(o => o.toLowerCase().indexOf(ql) >= 0);
      items = match.map(o => `<div class="dh-dd-item" data-v="${esc(o)}">${esc(o)}</div>`);
      if (match.indexOf(q) < 0) items.unshift(`<div class="dh-dd-item new" data-v="${esc(q)}">使用「${esc(q)}」</div>`);
    } else {
      items = opts.map(o => `<div class="dh-dd-item" data-v="${esc(o)}">${esc(o)}</div>`);
    }
    if (!items.length) items = ['<div class="dh-dd-item" style="color:var(--sub);">无选项</div>'];
    list.innerHTML = items.join('');
  };
  const open = () => { render(); list.style.display = 'block'; };
  input.addEventListener('focus', open);
  input.addEventListener('input', () => { render(); list.style.display = 'block'; });
  btn.addEventListener('click', e => { e.stopPropagation(); if (list.style.display === 'block') close(); else open(); });
  list.addEventListener('click', e => {
    const it = e.target.closest('.dh-dd-item'); if (!it) return;
    const v = it.getAttribute('data-v');
    if (v) input.value = v;
    close();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.dh-dd')) close(); });
}

async function dhSubmitAdd(){
  const date = ($('#dhADate').value || '').trim();
  const line = ($('#dhALine').value || '').trim();
  const model = ($('#dhAModel').value || '').trim();
  const reason = ($('#dhAReason').value || '').trim();
  const qty = ($('#dhAQty').value || '').trim();
  const stage = ($('#dhAStage').value || '').trim();
  const handle = ($('#dhAHandle').value || '').trim();
  if(!date){ toast('请填写日期'); return; }
  if(!model){ toast('请填写型号'); return; }
  if(!reason){ toast('请填写问题原因'); return; }
  const fd = new FormData();
  fd.append('date', date); fd.append('line', line);
  fd.append('model', model); fd.append('reason', reason); fd.append('qty', qty);
  fd.append('stage', stage); fd.append('handle', handle);
  // 上传已标注图片（优先 baked，否则原始）；提交后清空已上传文件（含标注图）
  dhAddFiles.forEach(it => fd.append('image', it.baked || it.file));
  const btn = $('#dhABtn'); btn.disabled = true; btn.textContent = '提交中…';
  try{
    const r = await (await fetch(dhAPI('add'), { method:'POST', body: fd })).json();
    if(r.ok){
      // 新线别/发生工程/处理方式 → 自动录入下拉选项（localStorage 持久化 + 内存即时生效）
      if (line && dhLineOpts.indexOf(line) < 0) dhLineOpts.push(line);
      if (stage && dhStageOpts.indexOf(stage) < 0) dhStageOpts.push(stage);
      if (handle && dhHandleOpts.indexOf(handle) < 0) dhHandleOpts.push(handle);
      dhLocalAdd('lines', line); dhLocalAdd('stages', stage); dhLocalAdd('handles', handle);
      // 清空已上传文件（含已标注图，避免重复提交）
      dhAddFiles.forEach(it => { if (it.bakedUrl) URL.revokeObjectURL(it.bakedUrl); if (it.url) URL.revokeObjectURL(it.url); });
      dhAddFiles = [];
      // 清空文件输入框
      const fi = $('#dhAImg'); if (fi) fi.value = '';
      toast('录入成功（已按日期排序写入汇总表' + (r.images ? '，含 ' + r.images + ' 图' : '') + '）');
      dhPageAdd();
    } else toast('录入失败：' + (r.error || '未知错误'));
  }catch(e){ toast('录入失败：' + (e.message || e)); }
  finally{ btn.disabled = false; btn.textContent = '💾 提交录入'; }
}

// ============ 图片标注工具 ============
const DH_ANNO_COLORS = ['#e11d48','#f59e0b','#eab308','#16a34a','#2563eb','#7c3aed','#111827','#ffffff'];
let dhAnnoState = null;
// 箭头轮廓路径（V3.2：V3 三角外观 + V3.1 后缘内凹，整体放大）
// 直肩（保持 V3 三角形识别度）+ 后缘内凹（V3.1 特征）+ 尖端略圆润
function drawArrowHead(ctx, T, d, p, hl, hw, notch){
  const P = (a, o) => ({ x: T.x - d.x * a + p.x * o, y: T.y - d.y * a + p.y * o });
  const tip = P(0, 0);
  const bL  = P(hl,  hw / 2);          // 左后角（全宽，保持 V3 三角外观）
  const bR  = P(hl, -hw / 2);          // 右后角
  const f = 0.04;                     // 尖端圆润偏移（沿肩比例）
  const Lt  = P(hl * f,  hw / 2 * f); // 尖左邻点
  const Rt  = P(hl * f, -hw / 2 * f); // 尖右邻点
  const ctrl = P(hl * notch, 0);       // 后缘内凹控制点（向尖端方向凹）
  ctx.beginPath();
  ctx.moveTo(Lt.x, Lt.y);
  ctx.quadraticCurveTo(tip.x, tip.y, Rt.x, Rt.y); // 尖端圆润
  ctx.lineTo(bR.x, bR.y);                          // 右直肩
  ctx.quadraticCurveTo(ctrl.x, ctrl.y, bL.x, bL.y);// 后缘内凹
  ctx.lineTo(Lt.x, Lt.y);                          // 左直肩（闭合）
  ctx.closePath();
}
// ── 箭头绘制（V3.2：V3 三角 + 后缘内凹 + 继续放大） ──
// 保留核心原则：① 头部尺寸=f(lw)仅，与箭长解耦（拉伸仅延长柄）；② 不同粗细等比缩放。
// 参数比例（全部 ∈ lw，在 V3.1 基础上继续放大）：
//   HL_R  = 5.0   头部长度 / 线宽（V3.1 为 4.0，继续放大）
//   HW_R  = 3.4   头部全宽 / 线宽（V3.1 为 2.8，继续放大）
//   NOTCH = 0.78  后缘内凹控制点位置（沿 hl 比例，<1 即向尖端方向凹）
function drawArrow(ctx, x1, y1, x2, y2, color, lw){
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ang = Math.atan2(dy, dx);
  const d = { x: Math.cos(ang), y: Math.sin(ang) };
  const p = { x: -Math.sin(ang), y: Math.cos(ang) };
  const HL_R = 5.0, HW_R = 3.4, NOTCH = 0.78;
  let hl = lw * HL_R;
  let hw = lw * HW_R;
  // 极短箭头安全钳制：整体等比缩小头部
  if (hl > len * 0.80){
    const k = (len * 0.80) / hl;
    hl *= k; hw *= k;
  }
  const T = { x: x2, y: y2 };
  const P = (a, o) => ({ x: T.x - d.x * a + p.x * o, y: T.y - d.y * a + p.y * o });
  const shaftEnd = P(hl * NOTCH, 0);   // 箭柆终点接入内凹后缘
  // 箭柆
  ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(shaftEnd.x, shaftEnd.y); ctx.stroke();
  // 头部（直肩三角 + 后缘内凹）

function dhAnnoPt(e){
  const cv = document.getElementById('dhAnnoCanvas');

}
// ===== 二次编辑：坐标换算与几何辅助 =====
// 画布后备分辨率=原图尺寸，绘制/命中均用原图坐标；
// 因此手柄尺寸、命中容差必须以"屏幕像素"定义后再换算到原图坐标，
// 否则大图（scale 很小）时锚点在屏幕上只有约 1px，既看不见也点不到。
const DH_HANDLE_PX = 7;   // 锚点半径（屏幕像素）
const DH_HIT_PX = 16;     // 锚点命中边长（屏幕像素）
const DH_EDGE_PX = 8;     // 图形边框命中带半宽（屏幕像素）
const DH_MIN_PX = 10;     // 缩放时最小边长（屏幕像素）

function dhAnnoNat(px){ return px / dhAnnoU(); }  // 屏幕像素 → 原图像素
function dhAnnoBox(s){
  if (s.type === 'rect' || s.type === 'ellipse'){
    const x = s.w >= 0 ? s.x : s.x + s.w, y = s.h >= 0 ? s.y : s.y + s.h;
    return { x: x, y: y, w: Math.abs(s.w), h: Math.abs(s.h) };
  }
  return null;
}
// 返回该图形的可拖拽锚点（矩形/椭圆四角；箭头两端；画笔/文字无）
function dhAnnoHandles(s){
  if (s.type === 'rect' || s.type === 'ellipse'){
    const b = dhAnnoBox(s);
    return [
      { x: b.x, y: b.y, type: 'tl' }, { x: b.x + b.w, y: b.y, type: 'tr' },
      { x: b.x, y: b.y + b.h, type: 'bl' }, { x: b.x + b.w, y: b.y + b.h, type: 'br' }
    ];
  }
  if (s.type === 'arrow') return [{ x: s.x1, y: s.y1, type: 'start' }, { x: s.x2, y: s.y2, type: 'end' }];
  return [];

function dhDistToSeg(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
  let t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function dhAnnoDown(e){
  if (!dhAnnoState) return;
  const cv = document.getElementById('dhAnnoCanvas');

  const ids = Object.keys(dhAnnoState.pointers);
  if (ids.length >= 2){
    const a = dhAnnoState.pointers[ids[0]], b = dhAnnoState.pointers[ids[1]];
    dhAnnoState.drawing = false;
    dhAnnoState.cur = null;
    dhAnnoState.gesture = true;
    const rect = cv.getBoundingClientRect();
    dhAnnoState.gRect0 = rect;
    dhAnnoState.gMid0x = (a.x + b.x) / 2;
    dhAnnoState.gMid0y = (a.y + b.y) / 2;
    dhAnnoState.gDist0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    dhAnnoState.gZoom0 = dhAnnoState.zoom;
    dhAnnoState.gPan0x = dhAnnoState.panX;
    dhAnnoState.gPan0y = dhAnnoState.panY;
    try { cv.setPointerCapture(e.pointerId); } catch (_){}
    e.preventDefault();
    return;
  }

  if (hh){
    dhAnnoState.selectedIdx = hh.idx;
    dhAnnoState.dragHandle = hh.type;      // 有值 = 缩放
    dhAnnoState.drawing = true;
    dhAnnoState.moved = false;
    dhAnnoState.start = p;
    dhAnnoState.origAnno = JSON.parse(JSON.stringify(dhAnnoState.anno[hh.idx]));
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
    e.preventDefault();
    dhAnnoDraw();
    return;
  }
  const hit = dhAnnoHitShape(p);
  if (hit >= 0){
    dhAnnoState.selectedIdx = hit;
    dhAnnoState.dragHandle = null;         // 无值 = 整体移动
    dhAnnoState.drawing = true;
    dhAnnoState.moved = false;
    dhAnnoState.start = p;
    dhAnnoState.origAnno = JSON.parse(JSON.stringify(dhAnnoState.anno[hit]));
    try { cv.setPointerCapture(e.pointerId); } catch(_){}

  dhAnnoState.start = p;

  else if (dhAnnoState.tool === 'arrow') dhAnnoState.cur = { type: 'arrow', x1: p.x, y1: p.y, x2: p.x, y2: p.y, color: dhAnnoState.color, size: dhAnnoState.size };

function dhAnnoMove(e){
  if (!dhAnnoState) return;
  if (dhAnnoState.gesture && dhAnnoState.pointers[e.pointerId]){
    dhAnnoState.pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(dhAnnoState.pointers);
    if (ids.length >= 2){
      const a = dhAnnoState.pointers[ids[0]], b = dhAnnoState.pointers[ids[1]];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const midx = (a.x + b.x) / 2, midy = (a.y + b.y) / 2;
      const z0 = dhAnnoState.gZoom0;
      const maxZoom = Math.max(1, Math.min(12, 1 / (dhAnnoState.scale || 1)));
      const z = Math.max(1, Math.min(maxZoom, z0 * dist / (dhAnnoState.gDist0 || 1)));
      const rect0 = dhAnnoState.gRect0;
      const ux = (dhAnnoState.gMid0x - rect0.left) / z0;
      const uy = (dhAnnoState.gMid0y - rect0.top) / z0;
      dhAnnoState.zoom = z;
      dhAnnoState.panX = (midx - rect0.left) - ux * z + dhAnnoState.gPan0x;
      dhAnnoState.panY = (midy - rect0.top) - uy * z + dhAnnoState.gPan0y;
      dhAnnoApplyTransform();
      e.preventDefault();
      return;
    }
  }
  if (!dhAnnoState.drawing) return;
  const p = dhAnnoPt(e);

  if (dhAnnoState.selectedIdx >= 0 && dhAnnoState.origAnno){
    const s = dhAnnoState.anno[dhAnnoState.selectedIdx];
    if (!s){ dhAnnoState.selectedIdx = -1; dhAnnoState.origAnno = null; }
    else {
      const orig = dhAnnoState.origAnno;
      const dx = p.x - dhAnnoState.start.x, dy = p.y - dhAnnoState.start.y;
      if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) dhAnnoState.moved = true;
      if (dhAnnoState.dragHandle && (s.type === 'rect' || s.type === 'ellipse')){

        else if (h === 'tr'){ w = orig.w + dx; h2 = orig.h - dy; ny = orig.y + dy; }
        else if (h === 'bl'){ w = orig.w - dx; h2 = orig.h + dy; nx = orig.x + dx; }

        if (dhAnnoState.dragHandle === 'start'){ s.x1 = p.x; s.y1 = p.y; }
        else { s.x2 = p.x; s.y2 = p.y; }
      } else {

        if (s.type === 'rect' || s.type === 'ellipse' || s.type === 'text'){ s.x = orig.x + dx; s.y = orig.y + dy; }
        else if (s.type === 'arrow'){ s.x1 = orig.x1 + dx; s.y1 = orig.y1 + dy; s.x2 = orig.x2 + dx; s.y2 = orig.y2 + dy; }

function dhAnnoPointerEnd(e){
  if (!dhAnnoState) return;

  if (ids.length < 2) dhAnnoState.gesture = false;
  if (!ids.length){
    if (dhAnnoState.selectedIdx >= 0 && dhAnnoState.origAnno){
      // 编辑完成：仅在实际产生位移/尺寸变化时才记入撤销历史；
      // 快照必须是"改动前"的完整数组（把该图形还原成 origAnno），否则撤销无效
      if (dhAnnoState.moved){
        const before = dhAnnoState.anno.slice();
        before[dhAnnoState.selectedIdx] = dhAnnoState.origAnno;
        dhAnnoState.undo.push(before);
        dhAnnoState.redo = [];
      }
      // 注意：不清除 selectedIdx —— 选中态保留，锚点持续可见，可反复微调

      const c = dhAnnoState.cur;
      if (c){
        let ok = true;
        if (c.type === 'free') ok = c.points.length > 1;
        else if (c.type === 'arrow') ok = (Math.abs(c.x2 - c.x1) > 2 || Math.abs(c.y2 - c.y1) > 2);
        else ok = (Math.abs(c.w) > 2 || Math.abs(c.h) > 2);
        if (ok) dhAnnoPush(c);
      }
    }
    dhAnnoState.drawing = false;
    dhAnnoState.cur = null;
    dhAnnoState.dragHandle = null;
    dhAnnoState.origAnno = null;
    dhAnnoDraw();
  }

function dhAnnoApplyTransform(){

function dhAnnoZoomAt(cx, cy, factor){
  if (!dhAnnoState) return;
  const cv = document.getElementById('dhAnnoCanvas');

  const z0 = dhAnnoState.zoom;
  const maxZoom = Math.max(1, Math.min(12, 1 / (dhAnnoState.scale || 1)));
  const z = Math.max(1, Math.min(maxZoom, z0 * factor));
  const ux = (cx - rect.left) / z0;
  const uy = (cy - rect.top) / z0;
  dhAnnoState.zoom = z;
  dhAnnoState.panX = (cx - rect.left) - ux * z + dhAnnoState.panX;
  dhAnnoState.panY = (cy - rect.top) - uy * z + dhAnnoState.panY;

function dhAnnoWheel(e){
  if (!dhAnnoState) return;

function dhAnnoResetView(){
  if (!dhAnnoState) return;
  dhAnnoState.zoom = 1; dhAnnoState.panX = 0; dhAnnoState.panY = 0;
  dhAnnoApplyTransform();
}
// 检测点是否在某个标注的调整手柄上，返回手柄类型，未命中返回null
// ① 命中锚点：已选中的图形优先（小图形也能稳定抓到锚点），其余按图层从上往下
function dhAnnoHitHandle(p){
  const half = dhAnnoNat(DH_HIT_PX) / 2;
  const order = [];
  if (dhAnnoState.selectedIdx >= 0 && dhAnnoState.anno[dhAnnoState.selectedIdx]) order.push(dhAnnoState.selectedIdx);
  for (let i = dhAnnoState.anno.length - 1; i >= 0; i--) if (i !== dhAnnoState.selectedIdx) order.push(i);
  for (const i of order){
    const s = dhAnnoState.anno[i]; if (!s) continue;
    for (const h of dhAnnoHandles(s)){
      if (Math.abs(p.x - h.x) <= half && Math.abs(p.y - h.y) <= half) return { idx: i, type: h.type };
    }
  }
  return null;
}
// ② 命中图形本体：描边图形只命中"边框带"，内部空白不命中，避免大图形挡住后续绘制
function dhAnnoHitShape(p){
  const pad = dhAnnoNat(DH_EDGE_PX);
  for (let i = dhAnnoState.anno.length - 1; i >= 0; i--){
    const s = dhAnnoState.anno[i]; if (!s) continue;
    if (s.type === 'rect' || s.type === 'ellipse'){
      const b = dhAnnoBox(s);
      const halfW = Math.max(1, (s.size || 1) / 2) + pad;
      if (s.type === 'rect'){
        const inOuter = p.x >= b.x - halfW && p.x <= b.x + b.w + halfW && p.y >= b.y - halfW && p.y <= b.y + b.h + halfW;
        const inInner = p.x >= b.x + halfW && p.x <= b.x + b.w - halfW && p.y >= b.y + halfW && p.y <= b.y + b.h - halfW;
        if (inOuter && !inInner) return i;
      } else {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        const rx = Math.max(1, b.w / 2), ry = Math.max(1, b.h / 2);
        const d = Math.hypot((p.x - cx) / rx, (p.y - cy) / ry);   // d≈1 表示正好落在椭圆周上
        if (Math.abs(d - 1) <= Math.max(halfW / rx, halfW / ry)) return i;
      }
    } else if (s.type === 'arrow'){
      if (dhDistToSeg(p, { x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }) <= (s.size || 1) + pad) return i;
    } else if (s.type === 'free'){
      for (const pt of (s.points || [])){
        if (Math.hypot(p.x - pt[0], p.y - pt[1]) <= (s.size || 1) + pad) return i;
      }
    } else if (s.type === 'text'){
      const fs = s.font || 24;
      const w = Math.max(fs, (s.text || '').length * fs * 0.6);
      if (p.x >= s.x - pad && p.x <= s.x + w + pad && p.y >= s.y - pad && p.y <= s.y + fs + pad) return i;
    }
  }
  return -1;
}
function dhAnnoPush(shape){
  dhAnnoState.undo.push(dhAnnoState.anno.slice());
  dhAnnoState.redo = [];
  dhAnnoState.anno.push(shape);
}
// 取消选中（数组被整体替换后索引会失效，必须重置）
function dhAnnoDeselect(){
  if (!dhAnnoState) return;
  dhAnnoState.selectedIdx = -1;
  dhAnnoState.dragHandle = null;
  dhAnnoState.origAnno = null;
}
function dhAnnoUndo(){
  if (!dhAnnoState || !dhAnnoState.undo.length) return;
  dhAnnoState.redo.push(dhAnnoState.anno.slice());
  dhAnnoState.anno = dhAnnoState.undo.pop();
  dhAnnoDeselect();
  dhAnnoDraw();
}
function dhAnnoRedo(){
  if (!dhAnnoState || !dhAnnoState.redo.length) return;
  dhAnnoState.undo.push(dhAnnoState.anno.slice());
  dhAnnoState.anno = dhAnnoState.redo.pop();
  dhAnnoDeselect();
  dhAnnoDraw();
}
function dhAnnoClear(){
  if (!dhAnnoState) return;
  if (!dhAnnoState.anno.length) return;
  dhAnnoState.undo.push(dhAnnoState.anno.slice());
  dhAnnoState.redo = [];
  dhAnnoState.anno = [];
  dhAnnoDeselect();
  dhAnnoDraw();
}
function dhAnnoDraw(){
  if (!dhAnnoState) return;
  const st = dhAnnoState, c = document.getElementById('dhAnnoCanvas'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  if (st.img && st.img.complete) ctx.drawImage(st.img, 0, 0, c.width, c.height);
  const drawShape = (s) => {
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = Math.max(1, s.size); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.type === 'rect') ctx.strokeRect(s.x, s.y, s.w, s.h);
    else if (s.type === 'ellipse'){ ctx.beginPath(); ctx.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w) / 2, Math.abs(s.h) / 2, 0, 0, Math.PI * 2); ctx.stroke(); }
    else if (s.type === 'arrow') drawArrow(ctx, s.x1, s.y1, s.x2, s.y2, s.color, Math.max(1, s.size));
    else if (s.type === 'free'){ ctx.beginPath(); s.points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
    else if (s.type === 'text'){ const fs = (s.font || Math.min(Math.max(24, st.natW * 0.04 * (s.size / 4)), st.natW * 0.1)); ctx.font = fs + 'px sans-serif'; ctx.textBaseline = 'top'; ctx.fillText(s.text, s.x, s.y); }
  };
  st.anno.forEach(drawShape);
  if (st.cur) drawShape(st.cur);
  // 绘制选中标注：蓝色虚线包围框 + 可拖拽锚点
  // 锚点半径/线宽由"屏幕像素"换算而来，保证放大或缩小后锚点始终是易于点按的固定大小
  if (st.selectedIdx >= 0 && st.anno[st.selectedIdx]){
    const s = st.anno[st.selectedIdx];
    const r = dhAnnoNat(DH_HANDLE_PX);
    ctx.save();
    const b = dhAnnoBox(s);
    if (b){
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = dhAnnoNat(1.5);
      ctx.setLineDash([dhAnnoNat(6), dhAnnoNat(4)]);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = dhAnnoNat(2);
    ctx.fillStyle = '#2563eb';
    dhAnnoHandles(s).forEach(h => {
      ctx.beginPath();
      ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });
    ctx.restore();
  }
}
function dhAnnoSave(){
  const st = dhAnnoState; if (!st) return;
  const it = dhAddFiles[st.idx];
  const cv = document.createElement('canvas'); cv.width = st.natW; cv.height = st.natH;
  const x = cv.getContext('2d');
  if (st.img && st.img.complete) x.drawImage(st.img, 0, 0, st.natW, st.natH);
  const drawN = (s) => {
    x.strokeStyle = s.color; x.fillStyle = s.color; x.lineWidth = Math.max(1, s.size); x.lineCap = 'round'; x.lineJoin = 'round';
    if (s.type === 'rect') x.strokeRect(s.x, s.y, s.w, s.h);
    else if (s.type === 'ellipse'){ x.beginPath(); x.ellipse(s.x + s.w / 2, s.y + s.h / 2, Math.abs(s.w) / 2, Math.abs(s.h) / 2, 0, 0, Math.PI * 2); x.stroke(); }
    else if (s.type === 'arrow') drawArrow(x, s.x1, s.y1, s.x2, s.y2, s.color, Math.max(1, s.size));
    else if (s.type === 'free'){ x.beginPath(); s.points.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); }
    else if (s.type === 'text'){ x.font = (s.font || Math.min(Math.max(24, st.natW * 0.04 * (s.size / 4)), st.natW * 0.1)) + 'px sans-serif'; x.textBaseline = 'top'; x.fillText(s.text, s.x, s.y); }
  };
  st.anno.forEach(drawN);
  cv.toBlob(b => {
    if (!b){ toast('标注烘焙失败'); return; }
    it.anno = st.anno.slice();
    it.baked = new File([b], it.file.name.replace(/\.(png|jpe?g|bmp)$/i, '') + '_anno.png', { type: 'image/png' });
    if (it.bakedUrl) URL.revokeObjectURL(it.bakedUrl);
    it.bakedUrl = URL.createObjectURL(it.baked);
    dhRenderAddPreviews();
    dhCloseAnno();
    toast('标注已应用，提交时将上传标注后的图片');
  }, 'image/png');
}

// 型号配色板（与后端导出图表一致）
const DH_MODEL_COLORS = ['#4472C4','#ED7D31','#70AD47','#FFC000','#7030A0','#E84C3D','#2E9BD9','#C00000','#00B0F0','#7F7F7F'];

// Canvas 堆叠柱状图：X=拉线；单柱=该拉线当月不良总单数，柱内按型号分段着色（颜色=型号）；
// 每个拉线的型号说明（色块+型号名）放置在该拉线正下方（不再使用集中式文本图例）。
function dhDrawAnalysisChart(r){
  const data = r.data || [], lines = r.lines || [], models = r.models || [];
  const colorOf = {};
  models.forEach((m, i) => { colorOf[m] = DH_MODEL_COLORS[i % DH_MODEL_COLORS.length]; });
  const groups = {};
  data.forEach(d => { (groups[d.line] = groups[d.line] || []).push(d); });
  const byModel = (a, b) => (models.indexOf(a.model) - models.indexOf(b.model));
  const canvas = $('#dhAnCanvas');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 320;
  const cssH = 300;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  // 型号文本折行：按 Canvas 实测宽度切行（规则与 docx _wrap_label 一致：完整显示不截断）
  const wrapTxt = (txt, maxW) => {
    ctx.font = '11px sans-serif';
    const out = []; let cur = '';
    for (const ch of String(txt || '')){
      if (cur && ctx.measureText(cur + ch).width > maxW){ out.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out.length ? out : [''];
  };
  // 底部标注区高度：按每拉线"型号折行后总行数"的最大值定（每行 15px，至少 1 行/型号）
  const plotW0 = cssW - 48;
  const slot0 = plotW0 / Math.max(1, lines.length);
  const textMaxW = slot0 - 26;
  const maxRows = Math.max.apply(null, lines.map(line => {
    const items = (groups[line] || []).slice().sort(byModel);
    return items.reduce((s, d) => s + wrapTxt(d.model, textMaxW).length, 0);
  })) || 0;
  const M = { l: 34, r: 14, t: 16, b: 58 + maxRows * 15 };
  canvas.style.height = cssH + 'px';
  const plotW = cssW - M.l - M.r, plotH = cssH - M.t - M.b;
  const maxTotal = Math.max.apply(null, data.map(d => d.total)) || 1;
  const yMax = Math.max(5, Math.ceil(maxTotal / 5) * 5);
  // 网格 + Y 轴
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#64748b';
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++){
    const y = M.t + plotH - (i / 5) * plotH;
    ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(M.l + plotW, y); ctx.stroke();
    ctx.fillText(String(Math.round(yMax * i / 5)), 4, y + 4);
  }
  const groupSlot = plotW / Math.max(1, lines.length);
  // 堆叠柱状图：每根柱=该拉线当月不良总单数，柱内按型号分段着色（颜色=型号）
  lines.forEach((line, gi) => {
    const items = (groups[line] || []).slice().sort(byModel);
    const gx = M.l + groupSlot * gi;
    const gw = groupSlot - 8;
    if (items.length === 0) return;
    const barW = Math.min(46, gw * 0.55);
    const cx = gx + gw / 2;
    const x = cx - barW / 2;
    const baseY = M.t + plotH;
    let acc = 0;
    items.forEach(d => {
      const h = (d.total / yMax) * plotH;
      ctx.fillStyle = colorOf[d.model] || '#999';
      ctx.fillRect(x, baseY - acc - h, barW, h);
      acc += h;
    });
    // 柱顶总单数标签
    const total = items.reduce((s, d) => s + d.total, 0);
    if (total > 0){
      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText(String(total), cx, baseY - acc - 4);
      ctx.font = '11px sans-serif';
    }
    // 柱下标注（恢复原版式）：拉线名（6 字符截断）+ 型号 色块+名称（完整显示，超宽自动折行）
    ctx.textAlign = 'center';
    ctx.font = '11px sans-serif';
    let lbl = line;
    if (lbl.length > 6) lbl = lbl.slice(0, 5) + '…';
    const labelY = cssH - M.b + 13;
    ctx.fillStyle = '#334155';
    ctx.fillText(lbl, cx, labelY);
    let ry = labelY + 16;
    items.forEach(d => {
      const ws = wrapTxt(d.model, textMaxW);
      ws.forEach((ln, li) => {
        const y = ry + li * 15;
        if (li === 0){
          ctx.fillStyle = colorOf[d.model] || '#999';
          ctx.fillRect(cx - 26, y - 8, 9, 9);
        }
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'left';
        ctx.fillText(ln, cx - 13, y);
      });
      ry += ws.length * 15;
    });
  });
  // 型号说明已随柱下标注展示，移除集中式文本图例
  $('#dhAnLegend').innerHTML = '';
}

async function invDoMove(dir){
  const m = inv.currentMaterial;
  const id = m && m.id;
  if (!id){ toast('材料未加载，请重试'); return; }
  const el = $(dir === 'in' ? '#itQtyIn' : '#itQtyOut');
  if (!el) return;
  const qty = parseFloat(el.value || '0');
  if (!(qty > 0)){ toast('请输入大于 0 的数量'); el.focus(); return; }
  const handlerEl = $('#itHandler');
  let handler = ((handlerEl && handlerEl.value) || '').trim();
  // 经手人为空时，自动带出上次使用过 / 最近使用过的经手人，避免空值卡死记账（后端必填）
  if (!handler) handler = (inv.lastHandler || (inv.handlers && inv.handlers[0] && inv.handlers[0].name) || '').trim();
  if (!handler){ toast('请填写经手人'); if (handlerEl) handlerEl.focus(); return; }
  const note = (($('#itNote') && $('#itNote').value) || '').trim();
  try {
    const r = await fetch(invAPI('materials/'+id+'/move'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({direction:dir, qty:qty, handler:handler, note:note})
    });
    const j = await r.json();
    if (!j.ok){ toast(j.error || '操作失败'); return; }
    inv.lastHandler = handler;
    toast(dir === 'in' ? ('已入库 +'+invFmtStock(qty)) : ('已出库 -'+invFmtStock(qty)));
    const mr = await fetch(invAPI('materials/'+id));
    const mj = await mr.json();
    if (mj.ok) inv.currentMaterial = mj.material;
    invRenderDetail();
    const h2 = $('#itHandler'); if (h2 && inv.lastHandler) h2.value = inv.lastHandler;
  } catch (e){ toast('操作失败：'+e.message); }
}

// 导出出入库明细流水 xlsx：读取筛选条件 → 请求 /api/invtail/export → 下载文件
// 说明：此前「生成 Excel 文件」按钮无响应，根因是本函数从未定义（onclick 调用报 ReferenceError）。
async function invDoExport(){
  const val = id => { const el = $(id); return el ? ((el.value || '') + '').trim() : ''; };
  const q = val('#itXQ'), handler = val('#itXHandler'), direction = val('#itXDir');
  const dateFrom = val('#itXFrom'), dateTo = val('#itXTo');
  if (dateFrom && dateTo && dateFrom > dateTo){ toast('起始日期不能晚于截止日期'); return; }

  const p = new URLSearchParams();
  if (q) p.set('q', q);
  if (handler) p.set('handler', handler);
  if (direction) p.set('direction', direction);
  if (dateFrom) p.set('dateFrom', dateFrom);
  if (dateTo) p.set('dateTo', dateTo);
  const qs = p.toString();
  const url = invAPI('export' + (qs ? ('?' + qs) : ''));

  try {
    toast('正在生成 Excel…');
    const r = await fetch(url);
    if (!r.ok){
      let msg = 'HTTP ' + r.status;
      try {
        const j = await r.json();
        if (j && j.error) msg = j.error;
      } catch (e) {}
      throw new Error(msg);
    }
    const blob = await r.blob();
    if (!blob || !blob.size) throw new Error('服务端返回空文件');

    // 文件名：优先取服务端 Content-Disposition（filename*=UTF-8''…），否则本地拼
    let fn = '';
    let cd = '';
    try { cd = (r.headers && r.headers.get) ? (r.headers.get('Content-Disposition') || '') : ''; } catch (e) { cd = ''; }
    const m = cd.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
    if (m && m[1]) { try { fn = decodeURIComponent(m[1]); } catch (e) { fn = m[1]; } }
    if (!fn) fn = '库存尾数出入库明细_' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.xlsx';

    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl; a.download = fn; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try { URL.revokeObjectURL(objUrl); } catch (e) {} try { a.remove(); } catch (e) {} }, 3000);
    toast('已导出：' + fn);
  } catch (err) {
    toast('导出失败：' + ((err && err.message) ? err.message : err));
    // 兜底：部分内置浏览器 blob 下载受限时，直接打开由服务端 Content-Disposition 触发下载
    try { window.open(url, '_blank'); } catch (e) {}
  }
}

async function invEditRecHandler(rid, el){
  if (!el || el.dataset.editing === '1') return;
  el.dataset.editing = '1';
  const cur = (el.textContent || '').trim();
  // 用共享的 itHandlerList datalist；不再额外注入 datalist 避免重复 id

  const inp = el.querySelector('input');
  try { inp.focus(); inp.select(); } catch(e) {}
  const restore = (txt) => { el.textContent = txt; el.removeAttribute('data-editing'); };
  const commit = async () => {
    const v = (inp.value || '').trim();
    if (!v || v === cur){ restore(cur); return; }
    try {
      const r = await fetch(invAPI('records/'+rid+'/handler'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({handler:v})});
      const j = await r.json();
      if (!j.ok){ toast(j.error || '修改失败'); restore(cur); return; }
      toast('已更新经手人 → '+v);
      el.removeAttribute('data-editing');
      invLoadMeta();
      const m = inv.currentMaterial;
      if (m) invOpenDetail(m.id);
    } catch (e) { toast('修改失败：'+e.message); restore(cur); }
  };
  inp.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); }
    else if (ev.key === 'Escape'){ ev.preventDefault(); restore(cur); }
  });
  inp.addEventListener('blur', commit);
}

async function invOcrOpen(opts, cb){
  itOcr.callback = cb;
  itOcr.results = [];
  itOcr.existing = [];
  itOcr.wb = 'auto';

  // 应用内选择面板（替代原生 confirm，减少系统提示）
  const src = await invOcrChooseSource();
  if (!src) return;

  let file;
  try {
    if (src === 'camera'){
      file = await invOcrCapture();
    } else {
      file = await invOcrPick();
    }
  } catch (e) {
    if (src === 'camera'){
      toast('摄像头未选择或不可用，已为您打开相册选择');
      try { file = await invOcrPick(); } catch (_) { return; }
    } else {
      toast('未选择图片'); return;
    }
  }
  if (!file) return;

  // 上传 + 透视矫正 + 白平衡
  const fd = new FormData();
  fd.append('image', file, 'capture.jpg');
  fd.append('wb', itOcr.wb);
  fd.append('autoWarp', '1');
  let prep;
  try {
    const resp = await fetch(invAPI('ocr/prepare'), {method:'POST', body: fd});
    prep = await resp.json();
    if (!prep.ok){ toast('拍照处理失败：'+prep.error); return; }
  } catch (e) { toast('上传失败：'+e.message); return; }

  itOcr.sessionId = prep.sessionId;
  itOcr.warpW = prep.width; itOcr.warpH = prep.height;
  itOcr.img = null;
  await invOcrBuildOverlay(prep.imageUrl + (prep.imageUrl.includes('?')?'&':'?') + 't=' + Date.now());
  invOcrRectReset();
  invOcrUpdateHint('照片已处理。' + (prep.warped ? '已自动校正透视。' : '未识别到文档边界，可点「点击四角」矫正，或直接拖动画框框选区域') + '在图上拖动画框框选要识别的区域（可框多次），完成后点「识别当前框」。');
  // 加载完成后渲染底部
  invOcrRenderResults();
}
